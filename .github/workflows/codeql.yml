name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new CodeQL queries also run against code that hasn't changed.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # "actions" checks the workflow files themselves, e.g. for script injection.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
      # Print each finding and the path the scanner traced to it, so an open alert can be read from the job log.
      - name: List findings
        if: always()
        run: |
          for f in ../results/*.sarif; do
            jq -r '.runs[].results[] | "FINDING \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)", ((.codeFlows // [])[:4][] | "  PATH " + ([.threadFlows[0].locations[].location | "\(.physicalLocation.artifactLocation.uri):\(.physicalLocation.region.startLine)"] | join(" > ")))' "$f"
          done
          echo "FINDINGS LISTED"
