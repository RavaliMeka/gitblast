<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your First Dockerfile Explainer</title>
<style>
  :root {
    --bg: #e3f1fc; --grid: #d3e4f1; --ink: #151515; --muted: #6b6b6b;
    --blue: #2f6fe4; --green: #22a45d; --red: #e5484d; --orange: #f2a33a;
    --card: #ffffff; --term: #1d1f23;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #111; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Inter, "Inter Display", system-ui, sans-serif; }
  #stage {
    position: relative; width: 1080px; height: 1920px; flex: none; overflow: hidden;
    background-color: var(--bg);
    background-image: radial-gradient(var(--grid) 3px, transparent 3.5px), radial-gradient(1200px 500px at 50% 0%, #fff8ec, transparent);
    background-size: 60px 60px, 100% 100%; transform-origin: center center;
  }
  .abs { position: absolute; }
  #steps { left: 0; right: 0; top: 150px; display: flex; justify-content: center; gap: 14px; }
  .step { min-width: 46px; height: 46px; border-radius: 23px; background: #e3e2dc; color: #777; font-weight: 700; font-size: 24px; display: flex; align-items: center; justify-content: center; padding: 0 14px; }
  .step.on { background: #151515; color: #ffd84a; letter-spacing: 1px; }
  #title { left: 40px; right: 40px; top: 220px; text-align: center; font-weight: 800; font-size: 84px; line-height: 1.12; color: var(--ink); letter-spacing: -1.5px; }
  .hl { position: relative; display: inline-block; }
  .hl::after { content: ""; position: absolute; left: -10px; right: -10px; bottom: -2px; top: 10px; z-index: -1; border-radius: 14px; rotate: -1.5deg; background: var(--mark, #cfe0ff); transform-origin: left; transform: scaleX(var(--mk, 1)); }
  .hl span { position: relative; }
  #char { left: 30px; top: 610px; width: 470px; height: 964px; }
  #prop { left: 470px; top: 560px; width: 580px; height: 860px; }
  #caption { left: 0; right: 0; top: 1500px; display: flex; justify-content: center; }
  #caption div { background: #ffd84a; color: #151515; font-weight: 800; font-size: 52px; padding: 16px 34px 20px; border-radius: 999px; border: 4px solid #151515; box-shadow: 6px 6px 0 #151515; max-width: 980px; text-align: center; }
  .card { background: var(--card); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 rgba(0,0,0,.08); }
  .card.top-blue { border-top: 12px solid var(--blue); }
  .card.top-green { border-top: 12px solid var(--green); }
  .card.top-red { border-top: 12px solid var(--red); }
  .big { font-weight: 800; font-size: 64px; color: var(--ink); text-align: center; }
  .sub { font-weight: 500; font-size: 30px; color: var(--muted); text-align: center; }
  .chip { display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 10px 18px; font-weight: 700; font-size: 28px; }
  .term { background: var(--term); border-radius: 22px; padding: 26px 28px; font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-size: 25px; line-height: 1.55; color: #e9e9e9; box-shadow: 0 10px 0 rgba(0,0,0,.12); }
  .term .p { color: #7ee2a8; }
  .term .c { color: #8b8f98; }
  .term .ok { color: #7ee2a8; }
  .term .cur { display: inline-block; width: 14px; height: 26px; background: #e9e9e9; vertical-align: -4px; }
  /* ===== v2 look: editorial paper, kinetic headline, commit-timeline progress ===== */
  #stage { background: radial-gradient(1100px 900px at 30% 40%, #ffffff, transparent 70%), #e3f1fc !important; }
  #grid { inset: 0; background-image: linear-gradient(rgba(21,21,21,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(21,21,21,.045) 1px, transparent 1px); background-size: 36px 36px; }
  #vig { inset: 0; background: radial-gradient(1500px 1800px at 50% 45%, transparent 60%, rgba(120,100,60,.14)); pointer-events: none; z-index: 8; }
  #title, #caption, #steps { display: none; }
  #meta { left: 60px; right: 60px; top: 64px; display: flex; justify-content: space-between; font: 600 24px "DejaVu Sans Mono", monospace; color: #8b877c; letter-spacing: 1px; z-index: 9; }
  #meta b { color: #0b84e3; font-weight: 700; }
  #tl { left: 60px; right: 60px; top: 118px; height: 30px; z-index: 9; }
  #kin { left: 60px; right: 60px; top: 190px; height: 330px; z-index: 9; text-align: left; font-weight: 800; font-size: 80px; line-height: 1.12; letter-spacing: -2.5px; color: #bdb9ad; }
  #kin .w { display: inline-block; margin-right: .24em; position: relative; }
  #kin .now, #kin .said { color: #151515; }
  #kin .box { position: absolute; inset: 4px -14px 0 -14px; border-radius: 14px; background: #0b84e3; rotate: -1.5deg; }
  #kin .tk { position: absolute; right: -52px; top: -40px; transform-origin: 0 100%; rotate: 20deg; }
  #kin .w:has(.box) { color: #fff; font-family: "DejaVu Sans Mono", monospace; font-size: .82em; letter-spacing: -2px; margin: 0 .36em 0 .14em; }
  #prop { left: 60px; top: 450px; z-index: 3; transform-origin: 0 0; filter: drop-shadow(0 26px 30px rgba(60,50,20,.16)); }
  #char { left: 240px; top: 1110px; width: 920px; height: 1886px; z-index: 6; overflow: visible; }
  #bgfx { inset: 0; z-index: 1; -webkit-mask-image: linear-gradient(180deg, transparent 0, transparent 19%, #000 23%, #000 52%, transparent 60%); mask-image: linear-gradient(180deg, transparent 0, transparent 19%, #000 23%, #000 52%, transparent 60%); font: 700 64px "DejaVu Sans Mono", monospace; color: #151515; }
  #bgfx span { position: absolute; opacity: .13; }
  #wipe { inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
  #wipe div { position: absolute; top: -10%; bottom: -10%; width: 46%; }
  #fx { inset: 0; z-index: 7; pointer-events: none; }
  #eq { left: 320px; bottom: 74px; height: 56px; display: flex; align-items: flex-end; gap: 7px; z-index: 9; }
  #eq i { width: 10px; border-radius: 5px; background: #0b84e3; }
  #handle { left: 60px; bottom: 70px; font: 700 28px "DejaVu Sans Mono", monospace; color: #151515; background: #fff; border: 3px solid #151515; border-radius: 12px; padding: 10px 18px; rotate: -2deg; box-shadow: 5px 5px 0 #151515; z-index: 9; }
  #hint { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #999; font: 13px system-ui; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid" class="abs"></div>
  <div id="steps" class="abs"></div>
  <div id="meta" class="abs"></div>
  <div id="tl" class="abs"></div>
  <div id="kin" class="abs"></div>
  <div id="bgfx" class="abs"></div>
  <div id="wipe" class="abs"></div>
  <div id="fx" class="abs"></div>
  <div id="eq" class="abs"></div>
  <svg width="0" height="0" style="position:absolute"><filter id="paper"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4a2c1d" flood-opacity=".12"/></filter></svg>
  <div class="abs" style="left:0;bottom:0;z-index:2;opacity:.2"><svg width="1080" height="44" style="display:block"><defs><pattern id="strip" width="90" height="44" patternUnits="userSpaceOnUse"><path d="M0 22 C15 8 30 8 45 22 C60 36 75 36 90 22 V44 H0 Z" fill="#0b84e3"/></pattern></defs><rect width="1080" height="44" fill="url(#strip)"/></svg></div>
  <div id="handle" class="abs">@dnimbus.ai</div>
  <div id="title" class="abs"></div>
  <svg id="char" class="abs" viewBox="0 0 400 820"></svg>
  <div id="prop" class="abs"></div>
  <div id="caption" class="abs"></div>
  <div id="vig" class="abs"></div>
</div>
<div id="hint">Click to restart · add ?t=12 to freeze a moment</div>
<script>

/* ---------- Script: scenes, captions, poses ---------- */
const S = [
  { t: 0,  title: 'You <span style="color:#d9412b">asked</span> for it!', pose: [[0,"point"]], mood: "happy",
    cap: [[0,"You asked for it..."],[2,"your first Dockerfile, in sixty seconds."]], prop: "asked" },
  { t: 5,  title: 'Dockerfile = <hl c="red">recipe</hl>', pose: [[0,"present"]], mood: "happy",
    cap: [[0,"A Dockerfile is a recipe."],[2,"Each line is one step."]], prop: "recipe" },
  { t: 9,  title: 'Step 1: <hl c="red">FROM</hl>', pose: [[0,"both"]], mood: "happy",
    cap: [[0,"Line one: FROM node twenty."],[3,"Start from a ready-made base... like a pizza base."]], prop: "from" },
  { t: 16, title: 'Step 2: <hl c="red">WORKDIR</hl>', pose: [[0,"point"]], mood: "happy",
    cap: [[0,"WORKDIR slash app:"],[2,"make a folder inside the box."]], prop: "workdir" },
  { t: 21, title: 'Step 3: <hl c="red">COPY</hl>', pose: [[0,"both"]], mood: "happy",
    cap: [[0,"COPY dot dot:"],[2,"put your code inside."]], prop: "copy" },
  { t: 25, title: 'Step 4: <hl c="red">RUN</hl>', pose: [[0,"point"]], mood: "happy",
    cap: [[0,"RUN npm install:"],[2,"install the libraries."]], prop: "run" },
  { t: 30, title: 'Step 5: <hl c="red">EXPOSE</hl>', pose: [[0,"both"]], mood: "happy",
    cap: [[0,"EXPOSE three thousand:"],[2,"the door your app talks through."]], prop: "expose" },
  { t: 35, title: 'Step 6: <hl c="red">CMD</hl>', pose: [[0,"point"]], mood: "happy",
    cap: [[0,"CMD node app dot js:"],[2,"what runs when the box starts."]], prop: "cmd" },
  { t: 40, title: 'Cook it: <hl c="green">build + run</hl>', pose: [[0,"present"]], mood: "happy",
    cap: [[0,"Now build it: docker build -t my-app ."],[4,"And run it: docker run -p 3000:3000 my-app"]], prop: "buildrun" },
  { t: 49, title: 'It\'s <hl c="green">alive!</hl>', pose: [[0,"present"],[1.2,"cheer"]], mood: "happy",
    cap: [[0,"Open localhost 3000... it's alive!"]], prop: "alive" },
  { t: 53, title: 'Next: <hl c="red">ports & volumes</hl>', pose: [[0,"peace"]], mood: "happy",
    cap: [[0,"Next: ports and volumes."],[2,"Save this, and follow for part three."]], prop: "next" },
];
let END = 58.5;
S.forEach((s, i) => s.end = i + 1 < S.length ? S[i + 1].t : END);

/* ---------- Helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const backOut = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
// entrance style: fade + rise + pop, starting `d` seconds into the scene
function pop(lt, d = 0, dur = 0.45) {
  // v2: each element flies in from a side (picked from its delay) with a bounce and a small spin
  const k = (lt - d) / dur, o = clamp(k * 1.6), b = backOut(k), h = Math.abs(Math.sin(d * 91.7 + 3.1) * 43758.5) % 1;
  const dir = h < .34 ? -1 : h < .68 ? 1 : 0;
  return `opacity:${o};transform:translate(${lerp(dir * 150, 0, b)}px, ${lerp(dir ? 20 : 60, 0, b)}px) rotate(${lerp(dir ? dir * 9 : -5, 0, b)}deg) scale(${lerp(.72, 1, b)});`;
}
const fade = (lt, d = 0, dur = 0.35) => `opacity:${clamp((lt - d) / dur)};`;
const COL = { blue: ["var(--blue)", "#d4e2ff"], green: ["var(--green)", "#d3f1df"], red: ["var(--red)", "#ffd9da"] };

/* ---------- Props: recipe-card theme ---------- */
const RD2 = "#d9412b", BR = "#4a2c1d", GN = "#3f8f4a", MS = "#e7a42a", PAPER = "#fffdf6", SOFT2 = "#8a6f5c";
const mono = "DejaVu Sans Mono, monospace", serif = "DejaVu Serif, Georgia, serif";
const svg = (inner, h = 680) => `<svg class="abs" style="left:0;top:0" width="600" height="${h}" viewBox="0 0 600 ${h}">${inner}</svg>`;
const T = (x, y, s, col = BR, size = 30, weight = 700, anchor = "start", font = "Inter", op = 1) =>
  `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="${font}" font-weight="${weight}" font-size="${size}" fill="${col}" opacity="${clamp(op)}">${s}</text>`;
const LINES = ["FROM node:20", "WORKDIR /app", "COPY . .", "RUN npm install", "EXPOSE 3000", 'CMD ["node", "app.js"]'];

// the recipe card: lines 0..n-1 written, line n-1 highlighted and typed
function recipe(n, lt, top = 10) {
  const rows = LINES.map((l, i) => {
    const y = top + 112 + i * 40;
    if (i >= n) return `<line x1="70" y1="${y + 8}" x2="560" y2="${y + 8}" stroke="#ead9c4" stroke-width="2"/>`;
    const cur = i === n - 1, k = cur ? clamp(lt / .7) : 1;
    const txt = l.slice(0, Math.ceil(l.length * k));
    return (cur ? `<rect x="58" y="${y - 24}" width="510" height="38" rx="8" fill="${MS}" opacity=".22"/>` : "") +
      T(40, y, String(i + 1), RD2, 20, 800, "middle", "Inter") + T(70, y, txt, BR, 24, 700, "start", mono);
  }).join("");
  return `<g filter="url(#paper)"><rect x="18" y="${top}" width="564" height="${110 + 6 * 40}" rx="14" fill="${PAPER}" stroke="#ead9c4" stroke-width="3"/></g>
    <rect x="18" y="${top}" width="564" height="62" rx="14" fill="${RD2}"/><rect x="18" y="${top + 40}" width="564" height="22" fill="${RD2}"/>
    ${T(300, top + 42, "Recipe: Dockerfile", "#fff", 28, 800, "middle", serif)}
    <line x1="58" y1="${top + 72}" x2="58" y2="${top + 100 + 6 * 40}" stroke="#f1b8ad" stroke-width="2"/>${rows}`;
}
// the box being cooked
function crate(x, y, w, h, inner = "", lid = 1) {
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#c98b4e"/>
    ${[1, 2, 3].map(i => `<rect x="${x}" y="${y + i * h / 4 - 3}" width="${w}" height="6" fill="#a86f39"/>`).join("")}
    <rect x="${x + 14}" y="${y + 14}" width="${w - 28}" height="${h - 28}" rx="6" fill="#fff6e6"/>${inner}
    <rect x="${x - 8}" y="${y - 18 - (1 - lid) * 40}" width="${w + 16}" height="22" rx="6" fill="#b7793f" transform="rotate(${(1 - lid) * -14} ${x} ${y})"/></g>`;
}
const ILL = 410; // y where illustrations start

const P = {
  asked: lt => svg([["DOCKER", 60, 120, .2], ["DOCKER 🔥", 330, 220, .6], ["docker pls", 90, 330, 1], ["DOCKER!!", 340, 430, 1.4]].map(([w, x, y, d]) =>
    `<g transform="translate(${x} ${y})"><g style="${pop(lt, d)}"><rect x="0" y="-46" width="${w.length * 22 + 90}" height="76" rx="38" fill="#fff" stroke="#ead9c4" stroke-width="3"/><circle cx="36" cy="-8" r="22" fill="${["#ffd27a", "#9bd4ff", "#ffb3c7", "#b9e8c2"][Math.round(d * 2.5) % 4]}"/>${T(70, 4, w, BR, 30, 800, "start", mono)}</g></g>`).join("") +
    T(300, 590, "your first Dockerfile ↓", RD2, 36, 800, "middle", serif, (lt - 2.2) / .3)),

  recipe: lt => svg(recipe(0, lt) + T(300, 520, "each line = one step", RD2, 34, 800, "middle", serif, (lt - 2) / .3)),

  from: lt => svg(recipe(1, lt) + `<g transform="translate(300 ${ILL + 120})"><g style="${pop(lt, 2.8)}">
      <circle r="105" fill="#e8b874"/><circle r="84" fill="#f6d9a4"/><circle cx="-30" cy="-20" r="6" fill="#e8b874"/><circle cx="35" cy="10" r="5" fill="#e8b874"/><circle cx="-5" cy="40" r="6" fill="#e8b874"/></g></g>` +
    T(300, ILL + 270, "ready-made base: node 20", SOFT2, 26, 700, "middle", "Inter", (lt - 3.4) / .3), 720),

  workdir: lt => svg(recipe(2, lt) + crate(170, ILL + 30, 260, 200,
    `<g transform="translate(300 ${ILL + 130})"><g style="${pop(lt, 1.6)}"><path d="M-60 -32 h40 l12 14 h68 v58 h-120 z" fill="${MS}"/>${T(0, 22, "/app", BR, 26, 800, "middle", mono)}</g></g>`, 0), 720),

  copy: lt => svg(recipe(3, lt) + crate(220, ILL + 30, 260, 200, "", 0) +
    [["app.js", 0], ["package.json", .5]].map(([f, d]) => {
      const k = easeOut(clamp((lt - 1.4 - d) / .8)), x = lerp(30, 290, k), y = lerp(ILL + 40 + d * 120, ILL + 110 + d * 40, k);
      return lt < 1.4 + d ? "" : `<g transform="translate(${x} ${y})"><rect x="0" y="0" width="${f.length * 15 + 40}" height="52" rx="8" fill="#fff" stroke="${BR}" stroke-width="3"/>${T(20, 34, f, BR, 22, 700, "start", mono)}</g>`;
    }).join(""), 720),

  run: lt => svg(recipe(4, lt) + crate(170, ILL + 30, 260, 200,
    [0, 1, 2, 3, 4, 5].map(i => { const d = 1.4 + i * .35, k = easeOut(clamp((lt - d) / .4)); return lt < d ? "" :
      `<rect x="${200 + (i % 3) * 66}" y="${lerp(ILL - 60, ILL + 60 + Math.floor(i / 3) * 62, k)}" width="56" height="50" rx="6" fill="${[RD2, GN, MS][i % 3]}"/>`; }).join(""), 0) +
    `<rect x="170" y="${ILL + 250}" width="260" height="16" rx="8" fill="#ead9c4"/><rect x="170" y="${ILL + 250}" width="${260 * clamp((lt - 1.2) / 3)}" height="16" rx="8" fill="${GN}"/>` +
    T(300, ILL + 300, "npm install", SOFT2, 24, 700, "middle", mono, (lt - 1.2) / .3), 740),

  expose: lt => { const open = easeOut(clamp((lt - 1.8) / .6));
    return svg(recipe(5, lt) + crate(140, ILL + 30, 260, 200, "", 1) +
      `<rect x="398" y="${ILL + 80}" width="${70 * (1 - open) + 8}" height="110" rx="6" fill="${RD2}"/><rect x="398" y="${ILL + 80}" width="70" height="110" rx="6" fill="none" stroke="${BR}" stroke-width="4"/>` +
      `<g transform="translate(500 ${ILL + 70})"><g style="${pop(lt, 1.4)}"><rect x="-44" y="-24" width="88" height="40" rx="8" fill="${BR}"/>${T(0, 6, "3000", "#fff", 24, 800, "middle", mono)}</g></g>` +
      T(300, ILL + 290, "the door your app talks through", SOFT2, 26, 700, "middle", "Inter", (lt - 2.4) / .3), 740); },

  cmd: lt => svg(recipe(6, lt) + crate(170, ILL + 30, 260, 200,
    `<g transform="translate(300 ${ILL + 130})"><g style="${pop(lt, 1.8)}"><circle r="52" fill="${GN}"/><path d="M-16 -26 L28 0 L-16 26 Z" fill="#fff"/></g></g>`, 1) +
    T(300, ILL + 290, "runs when the box starts", SOFT2, 26, 700, "middle", "Inter", (lt - 2.2) / .3), 740),

  buildrun: lt => `<div class="abs term" style="left:20px;top:40px;width:560px;font-size:24px;${pop(lt, 0, .3)}">
      <div><span class="p">$</span> docker build -t my-app .</div>
      <div class="ok" style="opacity:${clamp((lt - 1.6) / .3)}">✓ image my-app built</div>
      <div style="margin-top:18px;opacity:${clamp((lt - 4) / .3)}"><span class="p">$</span> docker run -p 3000:3000 my-app</div>
      <div class="ok" style="opacity:${clamp((lt - 6.5) / .3)}">✓ listening on port 3000</div></div>` +
    svg(`<g transform="translate(160 470)"><g style="${pop(lt, 1.7)}">${crate(-90, -70, 180, 140, "", 1)}</g></g>${T(160, 600, "image", SOFT2, 26, 800, "middle", "Inter", (lt - 1.8) / .3)}` +
      `<path d="M270 470 H330" stroke="${BR}" stroke-width="5" opacity="${clamp((lt - 4.5) / .3)}"/><path d="M318 458 L332 470 L318 482" stroke="${BR}" stroke-width="5" fill="none" opacity="${clamp((lt - 4.5) / .3)}"/>` +
      `<g transform="translate(440 470)"><g style="${pop(lt, 6.5)}">${crate(-90, -70, 180, 140, `<circle cx="68" cy="52" r="10" fill="${GN}"/>`, 1)}</g></g>${T(440, 600, "running", GN, 26, 800, "middle", "Inter", (lt - 6.6) / .3)}`, 680),

  alive: lt => svg(`<g style="${pop(lt, .1)}"><rect x="30" y="60" width="540" height="380" rx="20" fill="#fff" stroke="#ead9c4" stroke-width="3"/>
      <rect x="30" y="60" width="540" height="62" rx="20" fill="#f3e6d3"/><rect x="30" y="100" width="540" height="22" fill="#f3e6d3"/>
      <circle cx="64" cy="92" r="9" fill="#ff5f57"/><circle cx="92" cy="92" r="9" fill="#febc2e"/><circle cx="120" cy="92" r="9" fill="#28c840"/>
      <rect x="150" y="76" width="380" height="34" rx="17" fill="#fff"/>${T(170, 101, "localhost:3000", SOFT2, 22, 700, "start", mono)}
      ${T(300, 260, "Hello from", BR, 40, 800, "middle", serif, (lt - .6) / .3)}${T(300, 320, "Docker! 🐳", RD2, 52, 800, "middle", serif, (lt - .9) / .3)}</g>`),

  next: lt => svg(`<g style="${pop(lt, .2)}"><rect x="40" y="60" width="520" height="190" rx="18" fill="${PAPER}" stroke="#ead9c4" stroke-width="3"/>
      ${T(80, 130, "Part 3", RD2, 30, 800, "start", serif)}${T(80, 200, "Ports & Volumes", BR, 46, 800, "start", serif)}</g>` +
    `<g transform="translate(300 380)"><g style="${pop(lt, 2)}"><rect x="-180" y="-52" width="360" height="104" rx="52" fill="${RD2}"/>${T(0, 16, "+ Follow", "#fff", 44, 800, "middle")}</g></g>` +
    T(300, 500, "🔖 save for your next project", SOFT2, 28, 700, "middle", "Inter", (lt - 2.4) / .3)),
};

function term(lt, lines, top = 60) {
  const shown = lines.filter(([d]) => lt >= d);
  const last = shown[shown.length - 1];
  return `<div class="abs term" style="left:20px;top:${top}px;width:540px;min-height:150px;${pop(lt, 0, .35)}">
    <div style="display:flex;gap:10px;margin-bottom:18px"><i style="width:16px;height:16px;border-radius:50%;background:#ff5f57"></i><i style="width:16px;height:16px;border-radius:50%;background:#febc2e"></i><i style="width:16px;height:16px;border-radius:50%;background:#28c840"></i></div>
    ${shown.map(([d, h]) => {
      // type each command out
      const plain = h.replace(/<[^>]+>/g, "");
      const isCmd = h.startsWith('<span class="p">$</span>');

function poseAt(t) {
  const tl = [];
  S.forEach(s => s.pose.forEach(([d, p]) => tl.push([s.t + d, p])));
  let i = 0; while (i + 1 < tl.length && tl[i + 1][0] <= t) i++;

let LIPS = null;
function buildLips() {
  LIPS = [];

    const words = text.replace(/[^A-Za-z0-9#'., ]/g, " ").split(/\s+/).filter(Boolean);
    const sylls = [];

    const speak = Math.min(next - start - .25, units * .135);          // ~7 syllables a second, never past the next line

function speech(t, talking) {

  if (!LIPS) buildLips();

  let lo = 0, hi = LIPS.length - 1, hit = null;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (LIPS[m].b < t) lo = m + 1; else if (LIPS[m].a > t) hi = m - 1; else { hit = LIPS[m]; break; } }
  if (!hit) { const prev = LIPS[Math.max(0, hi)]; return { open: 0, wide: prev ? prev.shape : .55 }; }
  const f = (t - hit.a) / (hit.b - hit.a);
  return { open: hit.amp * Math.pow(Math.sin(Math.PI * f), .7), wide: hit.shape };
}

// messy hair: tufts around the top of the head
function hairTufts(cx, cy, r1, r2, a0, a1, n, seed) {
  let d = "";
  for (let i = 0; i <= n; i++) {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
    const am = (a0 + (a1 - a0) * (i + .5) / n) * Math.PI / 180;
    const rr = r2 + (hash(seed + i) - .5) * 16;
    const x = cx + Math.cos(a) * r1, y = cy + Math.sin(a) * r1;
    const tx = cx + Math.cos(am) * rr, ty = cy + Math.sin(am) * rr;
    d += (i === 0 ? `M${x} ${y}` : ` Q ${(x + tx) / 2 + 6} ${(y + ty) / 2 - 4} ${x} ${y}`) + (i < n ? ` Q ${tx - 4} ${ty + 6} ${tx} ${ty}` : "");

}

  present: [null, 0, REST], idle: [null, 0, REST], cross: [null, 0, "cross"], stand: [null, 0, "stand"], both: [null, 0, "both"],
  point: [null, 0, "point1"], thumb: [null, 0, "thumb"], shrug: [null, 0, "shrug"], peace: [null, 0, "peace"],

/* ---------- Pro: retime everything to the recorded voice ---------- */
window.TIMING = null;   // { caps: [{text,start,end,words:[t...]}...], end }  set by render.mjs --timing
let TIMED = false;
function applyTiming() {
  if (TIMED || !window.TIMING) return; TIMED = true;
  const C = window.TIMING.caps; let k = 0;
  S.forEach((sc, si) => {
    const oldCaps = sc.cap.map(c => c[0]);
    const mine = C.slice(k, k + sc.cap.length); sc.capIdx = mine.map((_, j) => k + j); k += sc.cap.length;
    sc.oldLen = (si + 1 < S.length ? S[si + 1].t : END) - sc.t;
    sc.newT = si === 0 ? 0 : Math.max(0, mine[0].start - .3);
    sc.oldCaps = oldCaps; sc.newCaps = mine.map(c => c.start - sc.newT);
  });
  END = window.TIMING.end + 1.6;
  S.forEach((sc, si) => { sc.t = sc.newT; });
  S.forEach((sc, si) => { sc.end = si + 1 < S.length ? S[si + 1].t : END; sc.newLen = sc.end - sc.t; });

  S.forEach(sc => { sc.pose = sc.pose.map(([d, p]) => [warpNew(sc, d), p]); sc.cap = sc.cap.map((c, j) => [sc.newCaps[j], c[1]]); });

}
// piecewise-linear maps between the old (designed) scene clock and the new (voice) scene clock
function anchors(sc) { return [[0, 0], ...sc.oldCaps.map((o, j) => [o, sc.newCaps[j]]).filter(([o, n]) => o > 0), [sc.oldLen, sc.newLen ?? sc.oldLen]]; }

const warpNew = (sc, oldLt) => mapPW(anchors(sc), oldLt, 0, 1);
const warpOld = (sc, newLt) => sc.oldCaps ? mapPW(anchors(sc), newLt, 1, 0) : newLt;

const KEY = new Set(["alive", "build", "cmd", "copy", "expose", "from", "ports", "recipe", "run", "volumes", "workdir"]);
// Each scene's visual is measured once and scaled to fit the visual area (960 x 540 px, starting at y 540),

const FIT = { W: 960, H: 680, MAX: 1.5 };

  $("stage").appendChild(box);
  const k = $("stage").getBoundingClientRect().width / 1080, len = sc.oldLen ?? (sc.end - sc.t);
  let w = 10, h = 10;
  [.35, .7, 1].forEach(f => {

function kinetic(t) {

    const st = c.words[i], shown = t >= st - .06;
    const k = clamp((t - (st - .06)) / .16);

    const cls = i === cur ? "now" : i < cur ? "said" : "";

    const style = `opacity:${k};transform:translateY(${(1 - easeOut(k)) * 14}px)`;
    return `<span class="w ${cls}" style="${style}">${box ? `<span class="box" style="transform:scale(${1 + .4 * (1 - easeOut((t - st) / .22))})"></span><svg class="tk" width="60" height="60" viewBox="0 0 60 60" style="opacity:${clamp(1 - (t - st) / .5)};transform:scale(${.5 + clamp((t - st) / .3) * .8})"><path d="M8 40 L20 30 M26 46 L28 28 M44 44 L36 30" stroke="#0b84e3" stroke-width="6" stroke-linecap="round"/></svg>` : ""}<span style="position:relative">${tk}</span></span>`;

/* ---------- Render one moment ---------- */
const $ = id => document.getElementById(id);
function render(t) {
  applyTiming();
  let si = 0; while (si + 1 < S.length && S[si + 1].t <= t) si++;
  const sc = S[si], lt = t - sc.t;

  // steps
  $("steps").innerHTML = sc.step ? [1, 2, 3, 4].map(n => `<div class="step ${n === sc.step ? "on" : ""}">${n === sc.step ? "STEP " + n : n}</div>`).join("") : "";

  $("title").innerHTML = sc.title.replace(/<hl c="(\w+)">(.*?)<\/hl>/g, (_, c, w) =>
    `<span class="hl" style="color:${(COL[c] || COL.blue)[0]};--mark:${(COL[c] || COL.blue)[1]};--mk:${mk}"><span>${w}</span></span>`);
  $("title").style.cssText = `opacity:${clamp(lt / .25)};transform:translateY(${lerp(24, 0, easeOut(lt / .35))}px)`;

  $("prop").innerHTML = P[sc.prop](olt);
  // camera: slow push-in through each scene with a gentle drift, quick settle on scene change

t x=\"15\" y=\"17\" width=\"9\" height=\"8\" rx=\"1.5\" fill=\"#ffb020\"/><rect x=\"25\" y=\"17\" width=\"9\" height=\"8\" rx=\"1.5\" fill=\"#ff6b5a\"/><rect x=\"35\" y=\"17\" width=\"9\" height=\"8\" rx=\"1.5\" fill=\"#22b573\"/><rect x=\"25\" y=\"8\" width=\"9\" height=\"8\" rx=\"1.5\" fill=\"#7c5cff\"/><path d=\"M4 34 C4 29 8 27 12 27 H46 C50 27 52 25 53 21 C54 17 58 15 61 17 C59 19 60 22 62 24 C59 25 58 28 57 32 C55 44 45 52 31 52 H22 C11 52 4 45 4 34 Z\" fill=\"#0b84e3\"/><path d=\"M12 44 C18 48 28 49 36 46\" stroke=\"#fff\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\" opacity=\".55\"/><circle cx=\"14\" cy=\"36\" r=\"2.6\" fill=\"#fff\"/><circle cx=\"14.6\" cy=\"36.4\" r=\"1.2\" fill=\"#14213d\"/></svg>", "<svg viewBox=\"0 0 64 64\" width=\"1em\" height=\"1em\" style=\"display:block\"><rect x=\"8\" y=\"18\" width=\"48\" height=\"30\" rx=\"4\" fill=\"none\" stroke=\"#0b84e3\" stroke-width=\"5\"/><path d=\"M20 18 V48 M32 18 V48 M44 18 V48\" stroke=\"#0b84e3\" stroke-width=\"4\"/></svg>"].map((g, i) => { const hx = (Math.sin(i * 12.9) * 43758.5 % 1 + 1) % 1, hy = (Math.sin(i * 78.2) * 12543.1 % 1 + 1) % 1;
    return `<span style="left:${hx * 960 + Math.sin(t * .3 + i) * 30}px;top:${((hy * 1900 - t * (14 + i * 3)) % 1960 + 1960) % 1960 - 60}px;transform:rotate(${Math.sin(t * .2 + i * 2) * 14}deg);font-size:${46 + (i % 3) * 22}px">${g}</span>`; }).join("");
  // voice equalizer next to the handle
  { const env = window.VOICE ? (window.VOICE.env[Math.floor(t * window.VOICE.fps)] || 0) : speech(t, true).open;
    $("eq").innerHTML = [0, 1, 2, 3, 4, 5, 6].map(i => `<i style="height:${8 + env * (26 + 22 * Math.abs(Math.sin(t * 9 + i * 1.7)))}px"></i>`).join(""); }

  { let cs = -1; S.forEach(s2 => s2.pose.forEach(([d, n]) => { if (n === "cheer" && s2.t + d <= t) cs = s2.t + d; })); const ct = t - cs;
    $("fx").innerHTML = cs >= 0 && ct < 2.4 ? `<svg width="1080" height="1920">${Array.from({ length: 46 }, (_, i) => { const a = -Math.PI / 2 + (((Math.sin(i * 7.3) * 9999) % 1) - .0) * 1.6, v = 700 + (i % 7) * 130;
      const x = 560 + Math.cos(a) * v * ct * (i % 2 ? 1 : -1) * .8, y = 1250 + Math.sin(a) * v * ct + 900 * ct * ct;
      return `<rect x="${x}" y="${y}" width="${14 + i % 3 * 6}" height="${10 + i % 2 * 12}" rx="3" fill="${["#0b84e3", "#151515", "#22a45d", "#2f6fe4", "#ffd84a"][i % 5]}" opacity="${clamp(2.4 - ct)}" transform="rotate(${i * 40 + ct * 400} ${x} ${y})"/>`; }).join("")}</svg>` : ""; }
  // presenter gives a small bounce on each scene change

  $("prop").style.transform = `translate(${fitScale(sc) * 0 + sc.fitX + Math.sin(t * .5 + si) * 8 + lerp(-50, 0, easeOut(lt / .4))}px, ${Math.cos(t * .4) * 9}px) rotate(${lerp(si % 2 ? 1.5 : -1.5, Math.sin(t * .6 + si) * .8, enter)}deg) scale(${fitScale(sc) * lerp(1, 1.03, sk) * lerp(.9, 1, enter) * (1 + punch * .04)})`;

  $("prop").style.opacity = clamp(lt / .3);
  $("kin").innerHTML = kinetic(t);
  // top meta row + commit-timeline progress: one dot per scene, HEAD rides along
  $("meta").innerHTML = `<span><span style="display:inline-flex;align-items:center;gap:14px"><span style="font-size:60px;margin:-18px 0"><svg viewBox="0 0 64 64" width="1em" height="1em" style="display:block"><rect x="15" y="17" width="9" height="8" rx="1.5" fill="#ffb020"/><rect x="25" y="17" width="9" height="8" rx="1.5" fill="#ff6b5a"/><rect x="35" y="17" width="9" height="8" rx="1.5" fill="#22b573"/><rect x="25" y="8" width="9" height="8" rx="1.5" fill="#7c5cff"/><path d="M4 34 C4 29 8 27 12 27 H46 C50 27 52 25 53 21 C54 17 58 15 61 17 C59 19 60 22 62 24 C59 25 58 28 57 32 C55 44 45 52 31 52 H22 C11 52 4 45 4 34 Z" fill="#0b84e3"/><path d="M12 44 C18 48 28 49 36 46" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55"/><circle cx="14" cy="36" r="2.6" fill="#fff"/><circle cx="14.6" cy="36.4" r="1.2" fill="#14213d"/></svg></span>ep.06 · docker dockerfile</span></span><span>SCENE <b>${String(si + 1).padStart(2, "0")}</b>/${S.length}</span>`;
  { const W = 960, n = S.length, px = i => 14 + i * (W - 28) / (n - 1), hx = 14 + clamp(t / (END - 1.6)) * (W - 28);
    $("tl").innerHTML = `<svg width="${W}" height="30" viewBox="0 0 ${W} 30"><path d="M14 15 H${W - 14}" stroke="#d9d5c8" stroke-width="4" stroke-linecap="round"/><path d="M14 15 H${hx}" stroke="#151515" stroke-width="4" stroke-linecap="round"/>` +
      S.map((_, i) => `<circle cx="${px(i)}" cy="15" r="${i === si ? 10 : 7}" fill="${i <= si ? "#151515" : "#f3f1ea"}" stroke="${i <= si ? "#151515" : "#d9d5c8"}" stroke-width="4"/>`).join("") +
      `<circle cx="${hx}" cy="15" r="6" fill="#0b84e3"/></svg>`; }
  $("grid").style.backgroundPosition = `${t * 6}px ${t * 4}px`;
}

/* ---------- Playback ---------- */
function fit() { const s = Math.min(innerWidth / 1080, innerHeight / 1920); $("stage").style.transform = `scale(${s})`; }
addEventListener("resize", fit); fit();
window.DURATION = END;
window.render = render;
const q = new URLSearchParams(location.search);
if (q.has("render")) { $("hint").remove(); document.body.style.background = "transparent"; $("stage").style.transform = "none"; }
else if (q.has("t")) render(parseFloat(q.get("t")));
else {
  let t0 = performance.now();
  addEventListener("click", () => t0 = performance.now());
  (function loop(now) { render(((now - t0) / 1000) % END); requestAnimationFrame(loop); })(performance.now());
}
