<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What is Docker Explainer</title>
<style>
  :root {
    --bg: #e3f1fc; --grid: #d3e4f1; --ink: #151515; --muted: #6b6b6b;
    --blue: #2f6fe4; --green: #22a45d; --red: #e5484d; --orange: #f2a33a;
    --card: #ffffff; --term: #1d1f23;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #111; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Inter, "Inter Display", system-ui, sans-serif; }
  #stage {
    position: relative; width: 1080px; height: 1920px; flex: none; overflow: hidden;
    background-color: var(--bg);
    background-image: radial-gradient(var(--grid) 3px, transparent 3.5px), radial-gradient(1200px 500px at 50% 0%, #fff8ec, transparent);
    background-size: 60px 60px, 100% 100%; transform-origin: center center;
  }
  .abs { position: absolute; }
  #steps { left: 0; right: 0; top: 150px; display: flex; justify-content: center; gap: 14px; }
  .step { min-width: 46px; height: 46px; border-radius: 23px; background: #e3e2dc; color: #777; font-weight: 700; font-size: 24px; display: flex; align-items: center; justify-content: center; padding: 0 14px; }
  .step.on { background: #151515; color: #ffd84a; letter-spacing: 1px; }
  #title { left: 40px; right: 40px; top: 220px; text-align: center; font-weight: 800; font-size: 84px; line-height: 1.12; color: var(--ink); letter-spacing: -1.5px; }
  .hl { position: relative; display: inline-block; }
  .hl::after { content: ""; position: absolute; left: -10px; right: -10px; bottom: -2px; top: 10px; z-index: -1; border-radius: 14px; rotate: -1.5deg; background: var(--mark, #cfe0ff); transform-origin: left; transform: scaleX(var(--mk, 1)); }
  .hl span { position: relative; }
  #char { left: 30px; top: 610px; width: 470px; height: 964px; }
  #prop { left: 470px; top: 560px; width: 580px; height: 860px; }
  #caption { left: 0; right: 0; top: 1500px; display: flex; justify-content: center; }
  #caption div { background: #ffd84a; color: #151515; font-weight: 800; font-size: 52px; padding: 16px 34px 20px; border-radius: 999px; border: 4px solid #151515; box-shadow: 6px 6px 0 #151515; max-width: 980px; text-align: center; }
  .card { background: var(--card); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 rgba(0,0,0,.08); }
  .card.top-blue { border-top: 12px solid var(--blue); }
  .card.top-green { border-top: 12px solid var(--green); }
  .card.top-red { border-top: 12px solid var(--red); }
  .big { font-weight: 800; font-size: 64px; color: var(--ink); text-align: center; }
  .sub { font-weight: 500; font-size: 30px; color: var(--muted); text-align: center; }
  .chip { display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 10px 18px; font-weight: 700; font-size: 28px; }
  .term { background: var(--term); border-radius: 22px; padding: 26px 28px; font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-size: 25px; line-height: 1.55; color: #e9e9e9; box-shadow: 0 10px 0 rgba(0,0,0,.12); }
  .term .p { color: #7ee2a8; }
  .term .c { color: #8b8f98; }
  .term .ok { color: #7ee2a8; }
  .term .cur { display: inline-block; width: 14px; height: 26px; background: #e9e9e9; vertical-align: -4px; }
  /* ===== v2 look: editorial paper, kinetic headline, commit-timeline progress ===== */
  #stage { background: radial-gradient(1100px 900px at 30% 40%, #ffffff, transparent 70%), #e3f1fc !important; }
  #grid { inset: 0; background-image: linear-gradient(rgba(21,21,21,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(21,21,21,.045) 1px, transparent 1px); background-size: 36px 36px; }
  #vig { inset: 0; background: radial-gradient(1500px 1800px at 50% 45%, transparent 60%, rgba(120,100,60,.14)); pointer-events: none; z-index: 8; }
  #title, #caption, #steps { display: none; }
  #meta { left: 60px; right: 60px; top: 64px; display: flex; justify-content: space-between; font: 600 24px "DejaVu Sans Mono", monospace; color: #8b877c; letter-spacing: 1px; z-index: 9; }
  #meta b { color: #0b84e3; font-weight: 700; }
  #tl { left: 60px; right: 60px; top: 118px; height: 30px; z-index: 9; }
  #kin { left: 60px; right: 60px; top: 190px; height: 330px; z-index: 9; text-align: left; font-weight: 800; font-size: 80px; line-height: 1.12; letter-spacing: -2.5px; color: #bdb9ad; }
  #kin .w { display: inline-block; margin-right: .24em; position: relative; }
  #kin .now, #kin .said { color: #151515; }
  #kin .box { position: absolute; inset: 4px -14px 0 -14px; border-radius: 14px; background: #0b84e3; rotate: -1.5deg; }
  #kin .tk { position: absolute; right: -52px; top: -40px; transform-origin: 0 100%; rotate: 20deg; }
  #kin .w:has(.box) { color: #fff; font-family: "DejaVu Sans Mono", monospace; font-size: .82em; letter-spacing: -2px; margin: 0 .36em 0 .14em; }
  #prop { left: 60px; top: 450px; z-index: 3; transform-origin: 0 0; filter: drop-shadow(0 26px 30px rgba(60,50,20,.16)); }
  #char { left: 240px; top: 1110px; width: 920px; height: 1886px; z-index: 6; overflow: visible; }
  #bgfx { inset: 0; z-index: 1; -webkit-mask-image: linear-gradient(180deg, transparent 0, transparent 19%, #000 23%, #000 52%, transparent 60%); mask-image: linear-gradient(180deg, transparent 0, transparent 19%, #000 23%, #000 52%, transparent 60%); font: 700 64px "DejaVu Sans Mono", monospace; color: #151515; }
  #bgfx span { position: absolute; opacity: .13; }
  #wipe { inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
  #wipe div { position: absolute; top: -10%; bottom: -10%; width: 46%; }
  #fx { inset: 0; z-index: 7; pointer-events: none; }
  #eq { left: 320px; bottom: 74px; height: 56px; display: flex; align-items: flex-end; gap: 7px; z-index: 9; }
  #eq i { width: 10px; border-radius: 5px; background: #0b84e3; }
  #handle { left: 60px; bottom: 70px; font: 700 28px "DejaVu Sans Mono", monospace; color: #151515; background: #fff; border: 3px solid #151515; border-radius: 12px; padding: 10px 18px; rotate: -2deg; box-shadow: 5px 5px 0 #151515; z-index: 9; }
  #hint { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #999; font: 13px system-ui; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid" class="abs"></div>
  <div id="steps" class="abs"></div>
  <div id="meta" class="abs"></div>
  <div id="tl" class="abs"></div>
  <div id="kin" class="abs"></div>
  <div id="bgfx" class="abs"></div>
  <div id="wipe" class="abs"></div>
  <div id="fx" class="abs"></div>
  <div id="eq" class="abs"></div>
  <div class="abs" style="left:0;bottom:0;z-index:2;opacity:.2"><svg width="1080" height="44" style="display:block"><defs><pattern id="strip" width="90" height="44" patternUnits="userSpaceOnUse"><path d="M0 22 C15 8 30 8 45 22 C60 36 75 36 90 22 V44 H0 Z" fill="#0b84e3"/></pattern></defs><rect width="1080" height="44" fill="url(#strip)"/></svg></div>
  <div id="handle" class="abs">@dnimbus.ai</div>
  <div id="title" class="abs"></div>
  <svg id="char" class="abs" viewBox="0 0 400 820"></svg>
  <div id="prop" class="abs"></div>
  <div id="caption" class="abs"></div>
  <div id="vig" class="abs"></div>
</div>
<div id="hint">Click to restart · add ?t=12 to freeze a moment</div>
<script>

/* ---------- Script: scenes, captions, poses ---------- */
const S = [
  { t: 0,  title: 'Works on <hl c="red">my machine!</hl>', pose: [[0,"shrug"]], mood: "curious",
    cap: [[0,"\"It works on my machine!\""],[2,"Every developer has said this."]], prop: "machine" },
  { t: 4,  title: 'Then the <hl c="red">server</hl> breaks', pose: [[0,"shrug"]], mood: "serious",
    cap: [[0,"Then it breaks on the server."],[2,"Why?"]], prop: "server" },
  { t: 7,  title: 'Different <hl c="red">setups</hl>', pose: [[0,"present"]], mood: "serious",
    cap: [[0,"Different setup:"],[1,"different versions, missing libraries."]], prop: "setups" },
  { t: 11, title: 'Enter <hl c="blue">Docker</hl>', pose: [[0,"idea"]], mood: "happy",
    cap: [[0,"Docker fixes this."]], prop: "enter" },
  { t: 13, title: 'Think: <hl c="orange">shipping container</hl>', pose: [[0,"present"]], mood: "happy",
    cap: [[0,"Think of a shipping container."],[2,"Whatever's inside... it fits every ship."]], prop: "ship" },
  { t: 19, title: 'Your app, <hl c="blue">packed</hl>', pose: [[0,"point"]], mood: "happy",
    cap: [[0,"Docker packs your app"],[2,"with everything it needs, into one box."]], prop: "pack" },
  { t: 24, step: 1, title: 'The recipe: <hl c="green">Dockerfile</hl>', pose: [[0,"both"]], mood: "happy",
    cap: [[0,"The recipe for that box"],[1,"is a Dockerfile."]], prop: "dockerfile" },
  { t: 27, step: 2, title: 'Build: an <hl c="blue">image</hl>', pose: [[0,"present"]], mood: "happy",
    cap: [[0,"Build it, and you get an image:"],[2,"a frozen snapshot of your app."]], prop: "image" },
  { t: 32, step: 3, title: 'Run: a <hl c="orange">container</hl>', pose: [[0,"point"]], mood: "happy",
    cap: [[0,"Run the image, and you get a container:"],[2,"your app, alive and running."]], prop: "container" },
  { t: 37, title: 'One image, <hl c="green">many containers</hl>', pose: [[0,"present"]], mood: "happy",
    cap: [[0,"One image..."],[1,"can run as many containers as you want."]], prop: "many" },
  { t: 41, title: '<hl c="green">Works everywhere</hl>', pose: [[0,"both"],[4,"cheer"]], mood: "happy",
    cap: [[0,"Same box on your laptop,"],[2,"on the server, in the cloud."],[4,"Works everywhere."]], prop: "everywhere" },
  { t: 47, title: 'Remember <hl c="blue">3 words</hl>', pose: [[0,"thumb"]], mood: "happy",
    cap: [[0,"Three words to remember:"],[1,"Dockerfile. Image. Container."]], prop: "recap" },
  { t: 52, title: 'Comment <hl c="orange">DOCKER</hl>', pose: [[0,"peace"]], mood: "happy",
    cap: [[0,"Want your first Dockerfile?"],[2,"Comment DOCKER..."],[4,"and follow for part two."]], prop: "cta" },
];
let END = 58.5;
S.forEach((s, i) => s.end = i + 1 < S.length ? S[i + 1].t : END);

/* ---------- Helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const backOut = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
// entrance style: fade + rise + pop, starting `d` seconds into the scene
function pop(lt, d = 0, dur = 0.45) {
  // v2: each element flies in from a side (picked from its delay) with a bounce and a small spin
  const k = (lt - d) / dur, o = clamp(k * 1.6), b = backOut(k), h = Math.abs(Math.sin(d * 91.7 + 3.1) * 43758.5) % 1;
  const dir = h < .34 ? -1 : h < .68 ? 1 : 0;
  return `opacity:${o};transform:translate(${lerp(dir * 150, 0, b)}px, ${lerp(dir ? 20 : 60, 0, b)}px) rotate(${lerp(dir ? dir * 9 : -5, 0, b)}deg) scale(${lerp(.72, 1, b)});`;
}
const fade = (lt, d = 0, dur = 0.35) => `opacity:${clamp((lt - d) / dur)};`;
const COL = { blue: ["var(--blue)", "#d4e2ff"], green: ["var(--green)", "#d3f1df"], red: ["var(--red)", "#ffd9da"] };

/* ---------- Props: Harbor theme (cargo containers on a light port) ---------- */
const DB = "#1d63ed", OR = "#ff7a2f", GR = "#1fa971", RD = "#e5484d", NV = "#0b2545", MU = "#5b7089";
const svg = (inner, h = 640) => `<svg class="abs" style="left:0;top:10px" width="600" height="${h}" viewBox="0 0 600 ${h}">${inner}</svg>`;
const T = (x, y, s, col = NV, size = 30, weight = 800, anchor = "start", font = "Inter", op = 1) =>
  `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="${font}" font-weight="${weight}" font-size="${size}" fill="${col}" opacity="${clamp(op)}">${s}</text>`;
const mono = "DejaVu Sans Mono, monospace";
const panel = (x, y, w, h, extra = "") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="#fff" stroke="#d6e4f2" stroke-width="3" ${extra}/>`;
// a corrugated shipping container
function box(x, y, w, h, col, label = "", k = 1) {
  if (k <= 0) return "";
  const s = backOut(clamp(k / .45));
  const ribs = Array.from({ length: Math.floor(w / 18) - 1 }, (_, i) => `<rect x="${x + 12 + i * 18}" y="${y + 10}" width="6" height="${h - 20}" rx="3" fill="#000" opacity=".1"/>`).join("");
  return `<g transform="translate(${x + w / 2} ${y + h}) scale(${s}) translate(${-(x + w / 2)} ${-(y + h)})">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${col}"/>${ribs}
    <rect x="${x}" y="${y}" width="${w}" height="10" rx="5" fill="#fff" opacity=".25"/>
    ${label ? `<rect x="${x + w / 2 - label.length * 9 - 14}" y="${y + h / 2 - 22}" width="${label.length * 18 + 28}" height="44" rx="8" fill="#fff"/>` + T(x + w / 2, y + h / 2 + 10, label, col, 26, 900, "middle") : ""}</g>`;
}
const arrow = (x1, y, x2, label, col = MU, k = 1) => k <= 0 ? "" :
  `<g opacity="${clamp(k * 2)}"><path d="M${x1} ${y} H${x1 + (x2 - x1) * clamp(k)}" stroke="${col}" stroke-width="6" stroke-linecap="round"/><path d="M${x2 - 14} ${y - 12} L${x2} ${y} L${x2 - 14} ${y + 12}" stroke="${col}" stroke-width="6" fill="none" stroke-linecap="round" opacity="${clamp((k - .8) * 5)}"/>${T((x1 + x2) / 2, y - 18, label, col, 22, 800, "middle", mono)}</g>`;
const tick = (x, y, k) => k <= 0 ? "" : `<g transform="translate(${x} ${y}) scale(${backOut(clamp(k / .4))})"><circle r="22" fill="${GR}"/><path d="M-10 0 l7 8 l13 -15" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;
const cross = (x, y, k) => k <= 0 ? "" : `<g transform="translate(${x} ${y}) scale(${backOut(clamp(k / .4))})"><circle r="22" fill="${RD}"/><path d="M-8 -8 L8 8 M8 -8 L-8 8" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>`;
const laptop = (x, y, s = 1, screen = "") => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-90" y="-120" width="180" height="120" rx="12" fill="${NV}"/><rect x="-80" y="-110" width="160" height="100" rx="6" fill="#e9f3ff"/>${screen}<path d="M-115 0 H115 L100 18 H-100 Z" fill="#b9c7d8"/></g>`;
const server = (x, y, s = 1, light = GR) => `<g transform="translate(${x} ${y}) scale(${s})">${[0, 1, 2].map(i => `<rect x="-70" y="${-150 + i * 50}" width="140" height="42" rx="8" fill="${NV}"/><circle cx="-48" cy="${-129 + i * 50}" r="6" fill="${light}"/><rect x="-30" y="${-133 + i * 50}" width="80" height="8" rx="4" fill="#3a5578"/>`).join("")}</g>`;
const cloud = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-70 0 C -110 0, -110 -55, -70 -58 C -65 -100, -5 -110, 10 -75 C 30 -105, 90 -95, 85 -50 C 120 -48, 120 0, 85 0 Z" fill="#fff" stroke="#bcd3ee" stroke-width="5"/></g>`;
function whale(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M-150 10 C -150 70, -60 100, 20 100 C 110 100, 160 50, 165 0 C 190 -5, 205 -25, 200 -45 C 185 -30, 170 -28, 160 -30 L 150 0 Z" fill="${DB}"/>
    <circle cx="-95" cy="40" r="9" fill="#fff"/><circle cx="-95" cy="40" r="4" fill="${NV}"/>
    ${[0, 1, 2].map(i => `<rect x="${-120 + i * 62}" y="-48" width="54" height="44" rx="5" fill="${[OR, GR, RD][i]}"/>`).join("")}
    ${[0, 1].map(i => `<rect x="${-89 + i * 62}" y="-100" width="54" height="44" rx="5" fill="${[GR, OR][i]}"/>`).join("")}</g>`;
}

const P = {
  machine: lt => svg(laptop(300, 330, 1.6, `<path d="M-30 -60 l22 24 l40 -46" stroke="${GR}" stroke-width="12" fill="none" stroke-linecap="round" opacity="${clamp((lt - .3) / .3)}"/>`) +
    T(300, 420, "works!", GR, 40, 900, "middle", "Inter", (lt - .4) / .3) +
    (lt > 2 ? `<g transform="translate(470 120)"><g style="${pop(lt, 2)}"><rect x="-120" y="-50" width="240" height="96" rx="24" fill="#fff" stroke="#d6e4f2" stroke-width="3"/><path d="M-60 44 L-80 80 L-30 44" fill="#fff"/>${T(0, 10, "every dev 😅", NV, 30, 800, "middle")}</g></g>` : "")),

  server: lt => svg(server(300, 330, 1.6, lt > .4 ? RD : GR) + cross(420, 120, (lt - .5) / .3) +
    T(300, 420, "Error: module not found", RD, 28, 700, "middle", mono, (lt - .8) / .3) +
    T(300, 465, "node v14 ≠ v20", RD, 28, 700, "middle", mono, (lt - 1.2) / .3) +
    (lt > 2 ? `<g transform="translate(300 560)"><g style="${pop(lt, 2)}">${T(0, 0, "why?!", NV, 70, 900, "middle")}</g></g>` : "")),

  setups: lt => {
    const rows = [["Node 20", "Node 14"], ["Python 3.12", "Python 3.8"], ["libssl ✓", "libssl —"]];
    return svg(panel(20, 40, 270, 400) + panel(310, 40, 270, 400) +
      T(155, 100, "Your laptop", NV, 30, 900, "middle") + T(445, 100, "Server", NV, 30, 900, "middle") +
      rows.map(([a, b], i) => T(55, 180 + i * 90, a, NV, 28, 700, "start", mono, (lt - .2 - i * .3) / .2) + tick(255, 170 + i * 90, (lt - .3 - i * .3)) +
        T(345, 180 + i * 90, b, NV, 28, 700, "start", mono, (lt - 1 - i * .4) / .2) + cross(545, 170 + i * 90, (lt - 1.1 - i * .4))).join("") +
      T(300, 520, "different setup = broken app", RD, 32, 900, "middle", "Inter", (lt - 2.8) / .3));
  },

  enter: lt => svg(`<g transform="translate(300 300)"><g style="${pop(lt, .1, .5)}">${whale(0, 0, 1.4)}</g></g>` +
    T(300, 520, "docker", DB, 64, 900, "middle", "Inter", (lt - .5) / .3)),

  ship: lt => svg(box(200, 60, 200, 110, OR, "your app", (lt - .1)) +
    [["🚢", "ship"], ["🚆", "train"], ["🚚", "truck"]].map(([e, w], i) => {
      const d = 2 + i * .7;
      return `<g opacity="${clamp((lt - .6 - i * .2) / .3)}">${panel(25 + i * 190, 300, 170, 190)}${T(110 + i * 190, 395, e, NV, 70, 400, "middle")}${T(110 + i * 190, 455, w, MU, 26, 800, "middle")}</g>` + tick(165 + i * 190, 310, (lt - d) / 1) +
        (lt > d ? `<path d="M300 175 C 300 230, ${110 + i * 190} 240, ${110 + i * 190} 295" stroke="${OR}" stroke-width="5" fill="none" stroke-dasharray="10 10" opacity="${clamp((lt - d) / .3)}"/>` : "");
    }).join("") + T(300, 560, "fits everywhere", OR, 34, 900, "middle", "Inter", (lt - 4.4) / .3)),

  pack: lt => {
    const items = [["your code", NV], ["Node 20", GR], ["libraries", DB], ["settings", OR]];
    const closed = clamp((lt - 3.8) / .4);
    return svg(items.map(([w, c], i) => {
      const d = .4 + i * .7, k = easeOut(clamp((lt - d) / .7));
      const sx = 90 + (i % 2) * 300, sy = 90 + Math.floor(i / 2) * 90;
      const x = lerp(sx, 300, k), y = lerp(sy, 380, k), o = lt < d ? 0 : 1 - clamp((k - .85) * 7);
      return `<g opacity="${o}" transform="translate(${x} ${y}) scale(${lerp(1, .6, k)})"><rect x="-90" y="-28" width="180" height="56" rx="28" fill="${c}"/>${T(0, 10, w, "#fff", 26, 800, "middle")}</g>`;
    }).join("") +
      `<rect x="150" y="360" width="300" height="170" rx="10" fill="${DB}"/>` + Array.from({ length: 15 }, (_, i) => `<rect x="${165 + i * 18}" y="372" width="6" height="146" rx="3" fill="#000" opacity=".1"/>`).join("") +
      `<rect x="150" y="${lerp(300, 360, closed)}" width="300" height="20" rx="6" fill="#174fbe" transform="rotate(${lerp(-25, 0, closed)} 150 ${lerp(300, 360, closed)})"/>` +
      (closed > .9 ? `<rect x="215" y="420" width="170" height="48" rx="8" fill="#fff"/>` + T(300, 453, "my-app", DB, 30, 900, "middle") : ""));
  },

  dockerfile: lt => {
    const L = [["FROM node:20", "base"], ["COPY . /app", "your code"], ["RUN npm install", "libraries"], ['CMD ["node", "app.js"]', "start it"]];
    return svg(panel(20, 40, 560, 420) + `<rect x="20" y="40" width="560" height="64" rx="22" fill="${NV}"/><rect x="20" y="80" width="560" height="24" fill="${NV}"/>` +
      T(50, 82, "Dockerfile", "#fff", 30, 800, "start", mono) +
      L.map(([c, n], i) => T(50, 170 + i * 72, c, NV, 28, 700, "start", mono, (lt - .8 - i * .45) / .2) + T(560, 170 + i * 72, "← " + n, GR, 22, 800, "end", "Inter", (lt - 1 - i * .45) / .2)).join("") +
      T(300, 540, "a recipe for your box", MU, 30, 800, "middle", "Inter", (lt - 2.6) / .3));
  },

  image: lt => svg(panel(20, 160, 170, 200) + T(105, 270, "Docker", NV, 26, 800, "middle", mono, 1) + T(105, 302, "file", NV, 26, 800, "middle", mono, 1) +
    arrow(205, 260, 365, "docker build", DB, (lt - .3) / .8) +
    (lt > 1.1 ? `<g style="${pop(lt, 1.1)}">${[2, 1, 0].map(i => `<rect x="${395 + i * 8}" y="${170 + i * 22}" width="170" height="150" rx="14" fill="${DB}" opacity="${.45 + (2 - i) * .27}"/>`).join("")}<text x="480" y="305" text-anchor="middle" font-size="64">❄</text>${T(480, 400, "image", DB, 36, 900, "middle")}</g>` : "") +

function term(lt, lines, top = 60) {
  const shown = lines.filter(([d]) => lt >= d);
  const last = shown[shown.length - 1];
  return `<div class="abs term" style="left:20px;top:${top}px;width:540px;min-height:150px;${pop(lt, 0, .35)}">
    <div style="display:flex;gap:10px;margin-bottom:18px"><i style="width:16px;height:16px;border-radius:50%;background:#ff5f57"></i><i style="width:16px;height:16px;border-radius:50%;background:#febc2e"></i><i style="width:16px;height:16px;border-radius:50%;background:#28c840"></i></div>
    ${shown.map(([d, h]) => {
      // type each command out
      const plain = h.replace(/<[^>]+>/g, "");
      const isCmd = h.startsWith('<span class="p">$</span>');
      if (!isCmd || (last && lt - d > 0.9)) return `<div>${h}</div>`;
      const n = Math.floor(clamp((lt - d) / 0.8) * (plain.length - 2));
      return `<div><span class="p">$</span> ${esc(plain.slice(2, 2 + n))}<span class="cur"></span></div>`;
    }).join("")}
  </div>`;
}
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ---------- Character: a friendly tech host behind a desk (flat illustration, soft shading) ---------- */
// Arm poses: [elbow, hand, hand shape] for the left and right arm, in the character's 400x820 space
const POSES = {
  idle:    { L: [[98, 600], [124, 716], "rest"],   R: [[302, 600], [276, 716], "rest"] },
  present: { L: [[98, 600], [124, 716], "rest"],   R: [[346, 520], [396, 466], "palm"] },
  point:   { L: [[98, 600], [124, 716], "rest"],   R: [[340, 492], [396, 424], "point"] },
  idea:    { L: [[78, 520], [94, 410], "up"],      R: [[302, 600], [276, 716], "rest"] },
  cross:   { L: [[118, 586], [270, 572], "rest"],  R: [[282, 596], [130, 588], "rest"] },
  thumb:   { L: [[98, 600], [124, 716], "rest"],   R: [[336, 566], [356, 484], "thumb"] },
  cheer:   { L: [[80, 384], [70, 292], "fist"],    R: [[320, 384], [330, 292], "fist"] },
  shrug:   { L: [[80, 540], [44, 500], "palmup"],  R: [[320, 540], [356, 500], "palmup"] },
};
const SH = { L: [126, 452], R: [274, 452] };

function poseAt(t) {
  const tl = [];
  S.forEach(s => s.pose.forEach(([d, p]) => tl.push([s.t + d, p])));
  let i = 0; while (i + 1 < tl.length && tl[i + 1][0] <= t) i++;
  const cur = POSES[tl[i][1]], prev = POSES[(tl[i - 1] || tl[i])[1]];
  const k = easeOut((t - tl[i][0]) / 0.35);
  const mix = side => {
    const a = prev[side], b = cur[side];
    return [[lerp(a[0][0], b[0][0], k), lerp(a[0][1], b[0][1], k)], [lerp(a[1][0], b[1][0], k), lerp(a[1][1], b[1][1], k)], k < .5 ? a[2] : b[2]];
  };
  return { L: mix("L"), R: mix("R"), name: tl[i][1], k };
}

const LOOK = {
  skin: "#f7c9aa", skinShade: "#e9a988", blush: "#f39a8a",

function hand(kind, x, y, ang, side) {
  const L = LOOK, sk = L.skin, sh = L.skinShade;
  const finger = (dx1, dy1, dx2, dy2) => `<path d="M${dx1} ${dy1} L${dx2} ${dy2}" stroke="${sh}" stroke-width="13" stroke-linecap="round"/><path d="M${dx1} ${dy1} L${dx2} ${dy2}" stroke="${sk}" stroke-width="9" stroke-linecap="round"/>`;
  const palm = `<circle r="16" fill="${sk}"/><path d="M-10 6 A 14 14 0 0 0 12 4" fill="none" stroke="${sh}" stroke-width="3" stroke-linecap="round"/>`;
  if (kind === "palm") return `<g transform="translate(${x} ${y}) rotate(${ang})"><path d="M-8 -14 C 16 -22, 40 -16, 42 -6 C 28 -4, 28 2, 40 6 C 36 14, 16 18, -8 14 Z" fill="${sk}"/><path d="M8 8 C 20 10, 30 8, 38 4" fill="none" stroke="${sh}" stroke-width="3" stroke-linecap="round"/></g>`;
  if (kind === "palmup") return `<g transform="translate(${x} ${y}) scale(${side === "L" ? -1 : 1} 1)"><path d="M-10 -6 C 8 6, 28 4, 40 -8 L 44 -2 C 34 16, 6 18, -10 10 Z" fill="${sk}"/></g>`;
  if (kind === "point") return `<g transform="translate(${x} ${y}) rotate(${ang})">${finger(6, -4, 40, -6)}${palm}</g>`;
  if (kind === "up") return `<g transform="translate(${x} ${y})">${finger(0, -8, 0, -42)}${palm}</g>`;

  return `<g transform="translate(${x} ${y})">${palm}</g>`;
}

function arm(sh, el, hd, kind, side, t, poseName) {
  if (side === "R" && (poseName === "present" || poseName === "point")) hd = [hd[0] + Math.sin(t * 3) * 4, hd[1] + Math.sin(t * 2.2) * 5];
  const d = `M${sh[0]} ${sh[1]} Q ${el[0]} ${el[1]} ${(el[0] + hd[0]) / 2} ${(el[1] + hd[1]) / 2} T ${hd[0]} ${hd[1]}`;

/* ---------- Mouth driver: voice loudness when there is a recording, a speech rhythm otherwise ---------- */
window.VOICE = null;           // set by render.mjs --voice: { env: [0..1 per frame], fps }
window.READY = Promise.resolve();
const hash = k => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
// Lip timeline built from the caption words: syllables of varied length, gaps between words, pauses at commas
let LIPS = null;
function buildLips() {
  LIPS = [];
  S.forEach((sc, si) => sc.cap.forEach(([d, text], ci) => {
    const start = sc.t + d + .08, next = ci + 1 < sc.cap.length ? sc.t + sc.cap[ci + 1][0] : sc.end;
    const words = text.replace(/[^A-Za-z0-9#'., ]/g, " ").split(/\s+/).filter(Boolean);
    const sylls = [];
    words.forEach((w, wi) => {
      const v = w.toLowerCase().match(/[aeiouy]+/g) || ["a"];
      v.forEach((g, gi) => sylls.push({ vowel: g[0], len: .7 + hash(si * 97 + ci * 13 + wi * 7 + gi) * .7, gapAfter: gi === v.length - 1 ? (/[,.]$/.test(w) ? 2.2 : .45) : 0 }));
    });
    const units = sylls.reduce((a, x) => a + x.len + x.gapAfter, 0);
    const speak = Math.min(next - start - .25, units * .135);          // ~7 syllables a second, never past the next line
    const k = speak / units; let tt = start;
    sylls.forEach((x, i) => {
      const dur = x.len * k, shape = /[ou]/.test(x.vowel) ? .1 : /[eiy]/.test(x.vowel) ? .85 : .55;
      LIPS.push({ a: tt, b: tt + dur, amp: .55 + hash(i * 31 + si) * .45, shape });
      tt += dur + x.gapAfter * k;
    });
  }));
}
function speech(t, talking) {
  if (window.VOICE) {
    const open = window.VOICE.env[Math.floor(t * window.VOICE.fps)] || 0;
    return { open, wide: .55 };
  }
  if (!LIPS) buildLips();
  // find the syllable at t (binary search)
  let lo = 0, hi = LIPS.length - 1, hit = null;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (LIPS[m].b < t) lo = m + 1; else if (LIPS[m].a > t) hi = m - 1; else { hit = LIPS[m]; break; } }
  if (!hit) { const prev = LIPS[Math.max(0, hi)]; return { open: 0, wide: prev ? prev.shape : .55 }; }
  const f = (t - hit.a) / (hit.b - hit.a);
  return { open: hit.amp * Math.pow(Math.sin(Math.PI * f), .7), wide: hit.shape };
}

// messy hair: tufts around the top of the head
function hairTufts(cx, cy, r1, r2, a0, a1, n, seed) {
  let d = "";
  for (let i = 0; i <= n; i++) {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
    const am = (a0 + (a1 - a0) * (i + .5) / n) * Math.PI / 180;
    const rr = r2 + (hash(seed + i) - .5) * 16;
    const x = cx + Math.cos(a) * r1, y = cy + Math.sin(a) * r1;
    const tx = cx + Math.cos(am) * rr, ty = cy + Math.sin(am) * rr;
    d += (i === 0 ? `M${x} ${y}` : ` Q ${(x + tx) / 2 + 6} ${(y + ty) / 2 - 4} ${x} ${y}`) + (i < n ? ` Q ${tx - 4} ${ty + 6} ${tx} ${ty}` : "");
  }
  return d;
}

  const fringe = `<path d="M96 246 C 92 170, 150 128, 214 132 C 268 136, 306 176, 304 236
      C 296 214, 288 204, 280 198 L 284 226 C 272 208, 260 196, 246 190 L 248 220 C 236 202, 222 192, 206 188
      L 210 214 C 196 198, 180 190, 164 190 L 160 218 C 150 202, 138 196, 126 198 L 124 230 C 116 214, 106 214, 96 246 Z" fill="${L.hair}"/>
    <path d="M150 156 Q 190 140 230 150 M232 158 Q 262 168 280 190" fill="none" stroke="${L.hairHi}" stroke-width="5" stroke-linecap="round"/>`;

/* ---------- Avatar presenter: a ready-made character whose mouth and eyes swap per frame ---------- */
// window.AVATAR = { closed, mid, open, wide?, blink } (SVG data URIs), set by render.mjs --avatar
window.AVATAR = null;
const REST = "stand";   // the normal talking pose: "stand" (hands down) unless house.json says "rest": "cross"
const POSE_MAP = {   // scene pose -> [accent picture or null, seconds, picture to settle into]
  // the default is the master pose (arms crossed): it has its own closed, small, round and wide mouths and a blink
  present: [null, 0, REST], idle: [null, 0, REST], cross: [null, 0, "cross"], stand: [null, 0, "stand"], both: [null, 0, "both"],
  point: [null, 0, "point1"], thumb: [null, 0, "thumb"], shrug: [null, 0, "shrug"], peace: [null, 0, "peace"],
  cheer: ["cheer", 3, REST], idea: ["idea", 1.6, REST], think: ["think", 1.8, REST],
};
function avatarPose(t, talking, A) {
  let st = 0, name = "idle";
  S.forEach(s => s.pose.forEach(([d, n]) => { if (s.t + d <= t) { st = s.t + d; name = n; } }));
  const [accent, secs, rest] = POSE_MAP[name] || POSE_MAP.idle, since = t - st;
  const showAccent = accent && since < secs, pic = showAccent ? accent : rest;
  const tick = Math.floor(t * 12), sp = speech(tick / 12, talking), open = sp.open;
  const has = k => A[k] && A[k][pic];
  const blink = (t + 1.3) % 3.9 < .13;
  let src = A.poseImg[pic];
  if (!showAccent) {
    const round = sp.wide < .3 || (tick * 7919) % 7 === 0;            // rounded vowels, plus a little variety
    if (open > .32) src = open > .8 && has("poseWide") ? A.poseWide[pic] : round && has("poseRound") ? A.poseRound[pic]
      : blink && has("poseBlinkTalk") ? A.poseBlinkTalk[pic] : A.poseTalk[pic] || src;
    else if (blink && has("poseBlink")) src = A.poseBlink[pic];
  }
  const change = showAccent ? since : accent ? since - secs : since;          // time since the picture last changed
  const pop = 1 + (change >= 0 && change < .28 ? Math.sin(Math.PI * change / .28) * .03 : 0);

  $("grid").style.backgroundPosition = `${t * 6}px ${t * 4}px`;
}

/* ---------- Playback ---------- */
function fit() { const s = Math.min(innerWidth / 1080, innerHeight / 1920); $("stage").style.transform = `scale(${s})`; }
addEventListener("resize", fit); fit();
window.DURATION = END;
window.render = render;
const q = new URLSearchParams(location.search);
if (q.has("render")) { $("hint").remove(); document.body.style.background = "transparent"; $("stage").style.transform = "none"; }
else if (q.has("t")) render(parseFloat(q.get("t")));
else {
  let t0 = performance.now();
  addEventListener("click", () => t0 = performance.now());
  (function loop(now) { render(((now - t0) / 1000) % END); requestAnimationFrame(loop); })(performance.now());
}
</script>
</body>
</html>
