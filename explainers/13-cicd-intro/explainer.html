<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What is CI/CD Explainer</title>
<style>
  :root {
    --bg: #e6f5ea; --grid: #d5e9da; --ink: #151515; --muted: #6b6b6b;
    --blue: #2f6fe4; --green: #22a45d; --red: #e5484d; --orange: #f2a33a;
    --card: #ffffff; --term: #1d1f23;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #111; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Inter, "Inter Display", system-ui, sans-serif; }
  #stage {
    position: relative; width: 1080px; height: 1920px; flex: none; overflow: hidden;
    background-color: var(--bg);
    background-image: radial-gradient(var(--grid) 3px, transparent 3.5px), radial-gradient(1200px 500px at 50% 0%, #fff8ec, transparent);
    background-size: 60px 60px, 100% 100%; transform-origin: center center;
  }
  .abs { position: absolute; }
  #steps { left: 0; right: 0; top: 150px; display: flex; justify-content: center; gap: 14px; }
  .step { min-width: 46px; height: 46px; border-radius: 23px; background: #e3e2dc; color: #777; font-weight: 700; font-size: 24px; display: flex; align-items: center; justify-content: center; padding: 0 14px; }
  .step.on { background: #151515; color: #ffd84a; letter-spacing: 1px; }
  #title { left: 40px; right: 40px; top: 220px; text-align: center; font-weight: 800; font-size: 84px; line-height: 1.12; color: var(--ink); letter-spacing: -1.5px; }
  .hl { position: relative; display: inline-block; }
  .hl::after { content: ""; position: absolute; left: -10px; right: -10px; bottom: -2px; top: 10px; z-index: -1; border-radius: 14px; rotate: -1.5deg; background: var(--mark, #cfe0ff); transform-origin: left; transform: scaleX(var(--mk, 1)); }
  .hl span { position: relative; }
  #char { left: 30px; top: 610px; width: 470px; height: 964px; }
  #prop { left: 470px; top: 560px; width: 580px; height: 860px; }
  #caption { left: 0; right: 0; top: 1500px; display: flex; justify-content: center; }
  #caption div { background: #ffd84a; color: #151515; font-weight: 800; font-size: 52px; padding: 16px 34px 20px; border-radius: 999px; border: 4px solid #151515; box-shadow: 6px 6px 0 #151515; max-width: 980px; text-align: center; }
  .card { background: var(--card); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 rgba(0,0,0,.08); }
  .card.top-blue { border-top: 12px solid var(--blue); }
  .card.top-green { border-top: 12px solid var(--green); }
  .card.top-red { border-top: 12px solid var(--red); }
  .big { font-weight: 800; font-size: 64px; color: var(--ink); text-align: center; }
  .sub { font-weight: 500; font-size: 30px; color: var(--muted); text-align: center; }
  .chip { display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 10px 18px; font-weight: 700; font-size: 28px; }
  .term { background: var(--term); border-radius: 22px; padding: 26px 28px; font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-size: 25px; line-height: 1.55; color: #e9e9e9; box-shadow: 0 10px 0 rgba(0,0,0,.12); }
  .term .p { color: #7ee2a8; }
  .term .c { color: #8b8f98; }
  .term .ok { color: #7ee2a8; }
  .term .cur { display: inline-block; width: 14px; height: 26px; background: #e9e9e9; vertical-align: -4px; }
  /* ===== v2 look: editorial paper, kinetic headline, commit-timeline progress ===== */
  #stage { background: radial-gradient(1100px 900px at 30% 40%, #ffffff, transparent 70%), #e6f5ea !important; }
  #grid { inset: 0; background-image: linear-gradient(rgba(21,21,21,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(21,21,21,.045) 1px, transparent 1px); background-size: 36px 36px; }
  #vig { inset: 0; background: radial-gradient(1500px 1800px at 50% 45%, transparent 60%, rgba(120,100,60,.14)); pointer-events: none; z-index: 8; }
  #title, #caption, #steps { display: none; }
  #meta { left: 60px; right: 60px; top: 64px; display: flex; justify-content: space-between; font: 600 24px "DejaVu Sans Mono", monospace; color: #8b877c; letter-spacing: 1px; z-index: 9; }
  #meta b { color: #0f9d58; font-weight: 700; }
  #tl { left: 60px; right: 60px; top: 118px; height: 30px; z-index: 9; }
  #kin { left: 60px; right: 60px; top: 190px; height: 330px; z-index: 9; text-align: left; font-weight: 800; font-size: 80px; line-height: 1.12; letter-spacing: -2.5px; color: #bdb9ad; }
  #kin .w { display: inline-block; margin-right: .24em; position: relative; }
  #kin .now, #kin .said { color: #151515; }
  #kin .box { position: absolute; inset: 4px -14px 0 -14px; border-radius: 14px; background: #0f9d58; rotate: -1.5deg; }
  #kin .tk { position: absolute; right: -52px; top: -40px; transform-origin: 0 100%; rotate: 20deg; }
  #kin .w:has(.box) { color: #fff; font-family: "DejaVu Sans Mono", monospace; font-size: .82em; letter-spacing: -2px; margin: 0 .36em 0 .14em; }
  #prop { left: 60px; top: 450px; z-index: 3; transform-origin: 0 0; filter: drop-shadow(0 26px 30px rgba(60,50,20,.16)); }
  #char { left: 240px; top: 1110px; width: 920px; height: 1886px; z-index: 6; overflow: visible; }
  #bgfx { inset: 0; z-index: 1; -webkit-mask-image: linear-gradient(180deg, transparent 0, transparent 19%, #000 23%, #000 52%, transparent 60%); mask-image: linear-gradient(180deg, transparent 0, transparent 19%, #000 23%, #000 52%, transparent 60%); font: 700 64px "DejaVu Sans Mono", monospace; color: #151515; }
  #bgfx span { position: absolute; opacity: .13; }
  #wipe { inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
  #wipe div { position: absolute; top: -10%; bottom: -10%; width: 46%; }
  #fx { inset: 0; z-index: 7; pointer-events: none; }
  #eq { left: 320px; bottom: 74px; height: 56px; display: flex; align-items: flex-end; gap: 7px; z-index: 9; }
  #eq i { width: 10px; border-radius: 5px; background: #0f9d58; }
  #handle { left: 60px; bottom: 70px; font: 700 28px "DejaVu Sans Mono", monospace; color: #151515; background: #fff; border: 3px solid #151515; border-radius: 12px; padding: 10px 18px; rotate: -2deg; box-shadow: 5px 5px 0 #151515; z-index: 9; }
  #hint { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #999; font: 13px system-ui; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid" class="abs"></div>
  <div id="steps" class="abs"></div>
  <div id="meta" class="abs"></div>
  <div id="tl" class="abs"></div>
  <div id="kin" class="abs"></div>
  <div id="bgfx" class="abs"></div>
  <div id="wipe" class="abs"></div>
  <div id="fx" class="abs"></div>
  <div id="eq" class="abs"></div>
  <div class="abs" style="left:0;bottom:0;z-index:2;opacity:.2"><svg width="1080" height="44" style="display:block"><defs><pattern id="strip" width="84" height="44" patternUnits="userSpaceOnUse"><path d="M0 22 H60" stroke="#0f9d58" stroke-width="6" stroke-dasharray="26 10"/><circle cx="66" cy="22" r="9" fill="#0f9d58"/></pattern></defs><rect width="1080" height="44" fill="url(#strip)"/></svg></div>
  <div id="handle" class="abs">@dnimbus.ai</div>
  <div id="title" class="abs"></div>
  <svg id="char" class="abs" viewBox="0 0 400 820"></svg>
  <div id="prop" class="abs"></div>
  <div id="caption" class="abs"></div>
  <div id="vig" class="abs"></div>
</div>
<div id="hint">Click to restart · add ?t=12 to freeze a moment</div>
<script>

/* ---------- Script: scenes, captions, poses ---------- */
const S = [
  { t: 0,  title: 'Deploying <hl c="yellow">by hand</hl>?', pose: [[0,"shrug"]], mood: "curious",
    cap: [[0,"You fixed a bug. Now what?"],[2,"Test it, build it, upload it, deploy it... by hand?"],[6,"Every. Single. Time?"]], prop: "manual" },
  { t: 8,  title: 'Enter <hl c="yellow">CI/CD</hl>', pose: [[0,"idea"]], mood: "happy",
    cap: [[0,"That's where CI/CD comes in."]], prop: "enter" },
  { t: 11, title: 'An <hl c="yellow">assembly line</hl>', pose: [[0,"present"]], mood: "happy",
    cap: [[0,"Think of a factory assembly line."],[3,"Your code goes in one end..."],[5,"and a tested, working app comes out the other."]], prop: "line" },
  { t: 19, step: 1, title: 'CI: <hl c="green">test</hl> every push', pose: [[0,"point"]], mood: "happy",
    cap: [[0,"CI is continuous integration:"],[3,"every push gets built and tested automatically."],[7,"Broken code gets caught before it spreads."]], prop: "ci" },
  { t: 30, step: 2, title: 'CD: <hl c="orange">ship</hl> what passes', pose: [[0,"both"]], mood: "happy",
    cap: [[0,"CD is continuous delivery:"],[2,"code that passes gets shipped automatically."],[6,"No late-night manual deploys."]], prop: "cd" },
  { t: 39, step: 3, title: 'The tool: <hl c="yellow">Actions</hl>', pose: [[0,"present"]], mood: "happy",
    cap: [[0,"The tool we'll use is GitHub Actions."],[3,"It's built into GitHub, and free to start."]], prop: "tool" },
  { t: 45, title: 'Robots <hl c="green">do the rest</hl>', pose: [[0,"point"],[1,"cheer"]], mood: "happy",
    cap: [[0,"Push code... robots do the rest."]], prop: "robots" },
  { t: 48, title: 'Remember', pose: [[0,"thumb"]], mood: "happy",
    cap: [[0,"CI: test every change."],[2.4,"CD: ship every change."]], prop: "recap" },
  { t: 53, title: 'Next: <hl c="yellow">first workflow</hl>', pose: [[0,"peace"]], mood: "happy",
    cap: [[0,"Next: your first workflow."],[2.2,"Follow for part two."]], prop: "next" },
];
let END = 58.5;
S.forEach((s, i) => s.end = i + 1 < S.length ? S[i + 1].t : END);

/* ---------- Helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const backOut = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
// entrance style: fade + rise + pop, starting `d` seconds into the scene
function pop(lt, d = 0, dur = 0.45) {
  // v2: each element flies in from a side (picked from its delay) with a bounce and a small spin
  const k = (lt - d) / dur, o = clamp(k * 1.6), b = backOut(k), h = Math.abs(Math.sin(d * 91.7 + 3.1) * 43758.5) % 1;
  const dir = h < .34 ? -1 : h < .68 ? 1 : 0;
  return `opacity:${o};transform:translate(${lerp(dir * 150, 0, b)}px, ${lerp(dir ? 20 : 60, 0, b)}px) rotate(${lerp(dir ? dir * 9 : -5, 0, b)}deg) scale(${lerp(.72, 1, b)});`;
}
const fade = (lt, d = 0, dur = 0.35) => `opacity:${clamp((lt - d) / dur)};`;
const COL = { blue: ["var(--blue)", "#d4e2ff"], green: ["var(--green)", "#d3f1df"], red: ["var(--red)", "#ffd9da"] };

/* ---------- Props: factory theme (conveyor belt and stations) ---------- */
const ST = "#37474f", YE = "#ffc300", OR2 = "#f77f00", GN2 = "#2a9d5c", RD3 = "#d62839", BLU = "#3d7dd8", MU4 = "#78909c";
const mono = "DejaVu Sans Mono, monospace";
const svg = (inner, h = 690) => `<svg class="abs" style="left:0;top:0" width="620" height="${h}" viewBox="0 0 620 ${h}">${inner}</svg>`;
const T = (x, y, s, col = ST, size = 28, weight = 800, anchor = "middle", font = "Inter", op = 1) =>
  `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="${font}" font-weight="${weight}" font-size="${size}" fill="${col}" opacity="${clamp(op)}">${s}</text>`;
const grow = (k, inner, x, y) => k <= 0 ? "" : `<g transform="translate(${x} ${y}) scale(${backOut(clamp(k / .4))})">${inner}</g>`;
const plate = (x, y, w, h, col = "#fff", stroke = "#cfd8dc") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${col}" stroke="${stroke}" stroke-width="4"/>`;
// conveyor belt at height y, moving with time t
function belt(y, t, x1 = 10, x2 = 610) {
  const off = (t * 60) % 40;
  return `<rect x="${x1}" y="${y}" width="${x2 - x1}" height="26" rx="13" fill="${ST}"/>` +
    Array.from({ length: Math.ceil((x2 - x1) / 40) }, (_, i) => { const x = x1 + 8 + i * 40 + off; return x < x2 - 14 ? `<rect x="${x}" y="${y + 9}" width="16" height="8" rx="2" fill="#607d8b"/>` : ""; }).join("") +
    [x1 + 13, (x1 + x2) / 2, x2 - 13].map(x => `<circle cx="${x}" cy="${y + 13}" r="9" fill="#90a4ae"/>`).join("") +
    `<path d="M${x1 + 40} ${y + 26} V${y + 70} M${x2 - 40} ${y + 26} V${y + 70}" stroke="${ST}" stroke-width="10"/>`;
}
// a station gantry over the belt
function station(x, y, label, col, active = false, t = 0) {
  const press = active ? Math.abs(Math.sin(t * 6)) * 14 : 0;
  return `<path d="M${x - 62} ${y} V${y - 150} H${x + 62} V${y}" fill="none" stroke="${ST}" stroke-width="10"/>
    <rect x="${x - 70}" y="${y - 196}" width="140" height="50" rx="8" fill="${col}"/><text x="${x}" y="${y - 162}" text-anchor="middle" font-family="Inter" font-weight="900" font-size="24" fill="#fff">${label}</text>
    <rect x="${x - 8}" y="${y - 146}" width="16" height="${50 + press}" fill="#90a4ae"/><rect x="${x - 26}" y="${y - 98 + press}" width="52" height="14" rx="4" fill="${col}"/>
    <circle cx="${x + 48}" cy="${y - 171}" r="7" fill="${active ? "#fff" : "rgba(255,255,255,.35)"}"/>`;
}
const crate = (x, y, col = BLU, label = "", s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-30" y="-54" width="60" height="54" rx="6" fill="${col}"/><rect x="-30" y="-54" width="60" height="10" rx="5" fill="#fff" opacity=".3"/>${label ? `<text y="-20" text-anchor="middle" font-family="${mono}" font-weight="700" font-size="16" fill="#fff">${label}</text>` : ""}</g>`;
const tick = (x, y, k, col = GN2) => grow(k, `<circle r="18" fill="${col}"/><path d="M-8 0 l6 7 l11 -13" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>`, x, y);
const gear = (x, y, r, t, col = ST) => `<g transform="translate(${x} ${y}) rotate(${t * 90})">${[0, 1, 2, 3, 4, 5, 6, 7].map(i => `<rect x="-7" y="${-r - 9}" width="14" height="18" rx="3" fill="${col}" transform="rotate(${i * 45})"/>`).join("")}<circle r="${r}" fill="${col}"/><circle r="${r * .4}" fill="#eceff1"/></g>`;
const SX = [130, 310, 490];

const P = {
  manual: lt => svg(["🧪 run tests", "🔨 build app", "📤 upload files", "🚀 deploy"].map((w, i) => `<g transform="translate(310 ${110 + i * 112})"><g style="${pop(lt, 2 + i * .7)}">${plate(-250, -44, 500, 88)}${T(-220, 12, w, ST, 32, 800, "start")}${T(220, 10, "by hand ✋", MU4, 22, 700, "end", mono)}</g></g>`).join("") +
    (lt > 6 ? `<g transform="translate(310 590)"><g style="${pop(lt, 6)}">${T(0, 0, "× every single time", RD3, 38, 900)}</g></g>` : "") + (lt < 2 ? T(310, 300, "🐛 → ✅", ST, 80, 800, "middle", "Inter", lt / .3) : "")),

  enter: lt => svg(`<g transform="translate(310 280)"><g style="${pop(lt, .1)}">${gear(-150, -60, 60, lt)}${gear(-60, 40, 44, -lt * 1.4, OR2)}<rect x="-40" y="-110" width="320" height="200" rx="20" fill="${YE}"/>${T(120, 10, "CI/CD", ST, 84, 900)}</g></g>` +
    T(310, 520, "automate the boring part", MU4, 28, 700, "middle", mono, (lt - .8) / .3)),

  line: lt => { const k = clamp((lt - 3) / 4.6), x = lerp(-40, 660, k), stage = x < 130 ? 0 : x < 310 ? 1 : x < 490 ? 2 : 3;
    return svg(SX.map((sx, i) => station(sx, 380, ["TEST", "BUILD", "SHIP"][i], [GN2, BLU, OR2][i], Math.abs(x - sx) < 44, lt)).join("") + belt(380, lt) +
      (lt > 3 ? crate(x, 380, [MU4, GN2, BLU, OR2][stage], ["code", "ok", "app", "live"][stage]) : "") +
      T(60, 480, "code in", MU4, 22, 700, "middle", mono, (lt - 3) / .3) + T(560, 480, "app out ✓", GN2, 22, 800, "middle", mono, (lt - 6.4) / .3) +
      T(310, 590, lt > 6.6 ? "tested · built · shipped" : "", ST, 30, 900)); },

  ci: lt => { let out = "";
    for (let i = 0; i < 4; i++) { const d = 3 + i * 1.5, bad = i === 3, k = clamp((lt - d) / 2.2); if (lt < d) continue;
      let x = lerp(-40, 660, k), y = 380; const tested = x > 310;
      if (bad && tested) { const f = clamp((x - 310) / 140); x = 310 + f * 60; y = 380 + f * f * 170; }
      out += crate(x, y, tested ? (bad ? RD3 : GN2) : MU4, tested ? (bad ? "bug" : "ok") : "push"); }
    return svg(station(310, 380, "TEST", GN2, lt > 3 && ((lt - 3) % 1.5) > .9 && ((lt - 3) % 1.5) < 1.4, lt) + belt(380, lt) + out +
      `<path d="M330 560 h110 l-12 80 h-86 z" fill="#b0bec5"/><rect x="322" y="548" width="126" height="16" rx="6" fill="${ST}"/>` + T(385, 668, "rejected", RD3, 20, 800, "middle", mono, (lt - 9) / .3) +
      T(120, 250, "every push", MU4, 24, 700, "middle", mono, (lt - 3) / .3) + T(520, 250, "passes ✓", GN2, 24, 800, "middle", mono, (lt - 4.6) / .3)); },

  cd: lt => { let out = "";
    for (let i = 0; i < 3; i++) { const d = 2 + i * 1.3, k = clamp((lt - d) / 2); if (lt < d) continue; const x = lerp(-40, 440, easeOut(k)); if (k < 1) out += crate(x, 380, GN2, "ok"); }
    const n = Math.min(3, Math.floor(Math.max(0, lt - 3.6) / 1.3) + (lt > 3.6 ? 1 : 0));
    return svg(belt(380, lt, 10, 430) + out +
      `<g transform="translate(490 330)"><path d="M-70 0 C -110 0, -110 -55, -70 -58 C -65 -100, -5 -110, 10 -75 C 30 -105, 90 -95, 85 -50 C 120 -48, 120 0, 85 0 Z" fill="#fff" stroke="${OR2}" stroke-width="6"/><text x="5" y="-22" text-anchor="middle" font-family="Inter" font-weight="900" font-size="26" fill="${OR2}">LIVE</text></g>` +
      Array.from({ length: n }, (_, i) => tick(450 + i * 46, 400, 1)).join("") +
      (lt > 6 ? `<g transform="translate(160 160)"><g style="${pop(lt, 6)}">${plate(-130, -60, 260, 120)}<text x="-70" y="16" text-anchor="middle" font-size="54">🌙</text>${T(40, 4, "2 a.m.", MU4, 24, 700, "middle", mono)}${T(40, 34, "deploys", MU4, 24, 700, "middle", mono)}<path d="M-120 50 L120 -50" stroke="${RD3}" stroke-width="8" stroke-linecap="round"/></g></g>` : "") +
      T(310, 560, lt > 2 ? "passes → ships itself" : "", ST, 30, 900, "middle", "Inter", (lt - 2.4) / .3)); },

  tool: lt => svg(`<g transform="translate(310 220)"><g style="${pop(lt, .2)}">${plate(-270, -140, 540, 280, "#fff", YE)}<circle cx="-160" cy="0" r="62" fill="${ST}"/><path d="M-178 -30 L-128 0 L-178 30 Z" fill="${YE}"/>${T(60, -14, "GitHub", ST, 46, 900)}${T(60, 44, "Actions", OR2, 50, 900)}</g></g>` +
    [["built into GitHub", GN2], ["free to start", BLU]].map(([w, c], i) => `<g transform="translate(${170 + i * 280} 470)"><g style="${pop(lt, 3 + i * .5)}"><rect x="-130" y="-36" width="260" height="72" rx="36" fill="${c}"/>${T(0, 9, w, "#fff", 24, 800)}</g></g>`).join("")),

  robots: lt => svg(plate(40, 40, 540, 90, ST, ST) + T(70, 96, "$ git push", YE, 30, 700, "start", mono) + gear(200, 300, 70, lt * 2) + gear(318, 372, 50, -lt * 2.8, OR2) + gear(420, 290, 58, lt * 2.4, BLU) +
    ["test", "build", "deploy"].map((w, i) => tick(150 + i * 160, 520, lt - .8 - i * .5) + T(150 + i * 160, 580, w, ST, 24, 800, "middle", mono, (lt - .9 - i * .5) / .2)).join("")),

  recap: lt => svg([["CI", "test every change", GN2, .1], ["CD", "ship every change", OR2, 2.4]].map(([a, b, c, d], i) => `<g transform="translate(310 ${170 + i * 240})"><g style="${pop(lt, d)}">${plate(-280, -95, 560, 190, "#fff", c)}<rect x="-250" y="-60" width="150" height="120" rx="16" fill="${c}"/>${T(-175, 22, a, "#fff", 62, 900)}${T(-70, 14, b, ST, 32, 800, "start")}</g></g>`).join("")),

  next: lt => svg(`<g transform="translate(310 200)"><g style="${pop(lt, .2)}">${plate(-280, -105, 560, 210)}${T(-240, -34, "Part 2", MU4, 28, 800, "start", mono)}${T(-240, 40, "Your first workflow", ST, 44, 900, "start")}</g></g>` +
    `<g transform="translate(310 440)"><g style="${pop(lt, 2.2)}"><rect x="-180" y="-52" width="360" height="104" rx="16" fill="${YE}"/>${T(0, 16, "+ Follow", ST, 44, 900)}</g></g>`),
};

function term(lt, lines, top = 60) {
  const shown = lines.filter(([d]) => lt >= d);
  const last = shown[shown.length - 1];
  return `<div class="abs term" style="left:20px;top:${top}px;width:540px;min-height:150px;${pop(lt, 0, .35)}">
    <div style="display:flex;gap:10px;margin-bottom:18px"><i style="width:16px;height:16px;border-radius:50%;background:#ff5f57"></i><i style="width:16px;height:16px;border-radius:50%;background:#febc2e"></i><i style="width:16px;height:16px;border-radius:50%;background:#28c840"></i></div>
    ${shown.map(([d, h]) => {
      // type each command out
      const plain = h.replace(/<[^>]+>/g, "");
      const isCmd = h.startsWith('<span class="p">$</span>');
      if (!isCmd || (last && lt - d > 0.9)) return `<div>${h}</div>`;
      const n = Math.floor(clamp((lt - d) / 0.8) * (plain.length - 2));
      return `<div><span class="p">$</span> ${esc(plain.slice(2, 2 + n))}<span class="cur"></span></div>`;
    }).join("")}

  for (let i = 0; i + 1 < A.length; i++) { const a = A[i], b = A[i + 1]; if (x <= b[from] || i + 2 === A.length) { const k = (x - a[from]) / Math.max(1e-6, b[from] - a[from]); return a[to] + (b[to] - a[to]) * k; } }
  return x;
}
const warpNew = (sc, oldLt) => mapPW(anchors(sc), oldLt, 0, 1);
const warpOld = (sc, newLt) => sc.oldCaps ? mapPW(anchors(sc), newLt, 1, 0) : newLt;

const KEY = new Set(["actions", "assembly", "by", "cd", "ci", "do", "first", "hand", "line", "rest", "ship", "test", "the", "workflow"]);
// Each scene's visual is measured once and scaled to fit the visual area (960 x 540 px, starting at y 540),
// so nothing ever sits behind the presenter, whose head starts below that area. Narrow visuals are centred.
const FIT = { W: 960, H: 680, MAX: 1.5 };
function fitScale(sc) {
  if (sc.fit) return sc.fit;
  const box = document.createElement("div"); box.style.cssText = "position:absolute;left:0;top:0;width:600px;visibility:hidden";
  $("stage").appendChild(box);
  const k = $("stage").getBoundingClientRect().width / 1080, len = sc.oldLen ?? (sc.end - sc.t);
  let w = 10, h = 10;
  [.35, .7, 1].forEach(f => {
    box.innerHTML = P[sc.prop](len * f - .05); const o = box.getBoundingClientRect();
    box.querySelectorAll("*").forEach(e => {
      if (["svg", "g", "defs", "clipPath", "filter"].includes(e.tagName) || e.closest("defs")) return;
      const r = e.getBoundingClientRect();
      if (r.width > 0 && r.height > 0) { w = Math.max(w, (r.right - o.left) / k); h = Math.max(h, (r.bottom - o.top) / k); }

  box.remove();
  sc.fit = Math.min(FIT.MAX, FIT.W / w, FIT.H / h); sc.fitX = Math.max(0, (FIT.W - w * sc.fit) / 2);

}
function tm() {
  if (window.TIMING) return window.TIMING;
  if (!window.SYN) {
    const caps = [];
    S.forEach(sc => sc.cap.forEach(([d, text], ci) => {
      const start = sc.t + d + .1, nxt = ci + 1 < sc.cap.length ? sc.t + sc.cap[ci + 1][0] : sc.end, n = text.split(" ").length, dur = Math.max(.3, Math.min(nxt - start - .3, n * .32));
      caps.push({ text, start, end: start + dur, words: text.split(" ").map((_, i) => start + dur * i / n) });
    }));
    window.SYN = { caps, end: END - 1.6 };
  }
  return window.SYN;
}
function kinetic(t) {
  const C = tm().caps;
  let ci = -1; C.forEach((c, i) => { if (t >= c.start - .05) ci = i; });
  if (ci < 0) return "";
  const c = C[ci], next = C[ci + 1];
  if (t > c.end + .9 && (!next || t < next.start - .05)) return "";          // clear during long pauses
  const toks = c.text.split(" ");
  let cur = -1; c.words.forEach((w, i) => { if (t >= w - .03) cur = i; });
  return toks.map((tk, i) => {
    const st = c.words[i], shown = t >= st - .06;
    const k = clamp((t - (st - .06)) / .16);
    const clean = tk.toLowerCase().replace(/[^a-z0-9]/g, "");
    const box = i === cur && KEY.has(clean);
    const cls = i === cur ? "now" : i < cur ? "said" : "";
    if (!shown) return "";
    const style = `opacity:${k};transform:translateY(${(1 - easeOut(k)) * 14}px)`;
    return `<span class="w ${cls}" style="${style}">${box ? `<span class="box" style="transform:scale(${1 + .4 * (1 - easeOut((t - st) / .22))})"></span><svg class="tk" width="60" height="60" viewBox="0 0 60 60" style="opacity:${clamp(1 - (t - st) / .5)};transform:scale(${.5 + clamp((t - st) / .3) * .8})"><path d="M8 40 L20 30 M26 46 L28 28 M44 44 L36 30" stroke="#0f9d58" stroke-width="6" stroke-linecap="round"/></svg>` : ""}<span style="position:relative">${tk}</span></span>`;
  }).join("");
}

/* ---------- Render one moment ---------- */
const $ = id => document.getElementById(id);
function render(t) {
  applyTiming();
  let si = 0; while (si + 1 < S.length && S[si + 1].t <= t) si++;
  const sc = S[si], lt = t - sc.t;

  // steps
  $("steps").innerHTML = sc.step ? [1, 2, 3, 4].map(n => `<div class="step ${n === sc.step ? "on" : ""}">${n === sc.step ? "STEP " + n : n}</div>`).join("") : "";

  // title with highlighted word
  const mk = easeOut((lt - .25) / .4);
  $("title").innerHTML = sc.title.replace(/<hl c="(\w+)">(.*?)<\/hl>/g, (_, c, w) =>
    `<span class="hl" style="color:${(COL[c] || COL.blue)[0]};--mark:${(COL[c] || COL.blue)[1]};--mk:${mk}"><span>${w}</span></span>`);
  $("title").style.cssText = `opacity:${clamp(lt / .25)};transform:translateY(${lerp(24, 0, easeOut(lt / .35))}px)`;

  // caption
  let ci = -1; sc.cap.forEach(([d], i) => { if (lt >= d) ci = i; });
  const capStart = ci >= 0 ? sc.cap[ci][0] : 0, capEnd = ci + 1 < sc.cap.length ? sc.cap[ci + 1][0] : sc.end - sc.t;
  const cl = lt - capStart;
  $("caption").innerHTML = ci >= 0 ? `<div style="transform:scale(${lerp(.9, 1, backOut(cl / .25))});opacity:${clamp(cl / .12)}">${sc.cap[ci][1]}</div>` : "";
  const talking = ci >= 0 && lt < capEnd - 0.25 && cl < Math.max(1.1, sc.cap[ci][1].length * 0.075);

  $("char").innerHTML = window.AVATAR ? avatarSvg(t, talking) : charSvg(t, talking, sc.mood);
  const olt = warpOld(sc, lt);
  $("prop").innerHTML = P[sc.prop](olt);
  // camera: slow push-in through each scene with a gentle drift, quick settle on scene change
  const sk = clamp(lt / Math.max(1, sc.end - sc.t)), enter = easeOut(lt / .45);
  // ---- v2 extra motion ----
  // seconds since the most recent key word started (drives the zoom-punch)
  let kp = 9;
  tm().caps.forEach(c => { const tk = c.text.split(" "); c.words.forEach((w, i) => { if (t >= w && t - w < kp && KEY.has(tk[i].toLowerCase().replace(/[^a-z0-9]/g, ""))) kp = t - w; }); });
  const punch = kp < .3 ? Math.sin(Math.PI * kp / .3) : 0;
  $("kin").style.transform = `scale(${1 + punch * .035})`; $("kin").style.transformOrigin = "0 50%";
  // scene changes stay quiet: no full-screen wipe, the new visual just slides in
  $("wipe").innerHTML = "";
  // drifting code symbols in the background
  $("bgfx").innerHTML = ["<svg viewBox=\"0 0 64 64\" width=\"1em\" height=\"1em\" style=\"display:block\"><g fill=\"#0f9d58\"><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(0 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(45 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(90 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(135 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(180 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(225 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(270 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(315 32 32)\"/></g><circle cx=\"32\" cy=\"32\" r=\"17\" fill=\"#0f9d58\"/><circle cx=\"32\" cy=\"32\" r=\"7\" fill=\"#fff\"/></svg>", "<svg viewBox=\"0 0 64 64\" width=\"1em\" height=\"1em\" style=\"display:block\"><circle cx=\"32\" cy=\"32\" r=\"24\" fill=\"none\" stroke=\"#0f9d58\" stroke-width=\"5\"/><path d=\"M21 33 L29 41 L44 24\" fill=\"none\" stroke=\"#0f9d58\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "<svg viewBox=\"0 0 64 64\" width=\"1em\" height=\"1em\" style=\"display:block\"><path d=\"M20 22 C8 22 8 42 20 42 C30 42 34 22 44 22 C56 22 56 42 44 42 C40 42 37 39 35 36\" fill=\"none\" stroke=\"#0f9d58\" stroke-width=\"6\" stroke-linecap=\"round\"/><path d=\"M29 37 L35 35 L37 42\" fill=\"none\" stroke=\"#0f9d58\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "<svg viewBox=\"0 0 64 64\" width=\"1em\" height=\"1em\" style=\"display:block\"><g fill=\"#0f9d58\"><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(0 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(45 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(90 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(135 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(180 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(225 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(270 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(315 32 32)\"/></g><circle cx=\"32\" cy=\"32\" r=\"17\" fill=\"#0f9d58\"/><circle cx=\"32\" cy=\"32\" r=\"7\" fill=\"#fff\"/></svg>", "<svg viewBox=\"0 0 64 64\" width=\"1em\" height=\"1em\" style=\"display:block\"><circle cx=\"32\" cy=\"32\" r=\"24\" fill=\"none\" stroke=\"#0f9d58\" stroke-width=\"5\"/><path d=\"M21 33 L29 41 L44 24\" fill=\"none\" stroke=\"#0f9d58\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "<svg viewBox=\"0 0 64 64\" width=\"1em\" height=\"1em\" style=\"display:block\"><g fill=\"#0f9d58\"><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(0 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(45 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(90 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(135 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(180 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(225 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(270 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(315 32 32)\"/></g><circle cx=\"32\" cy=\"32\" r=\"17\" fill=\"#0f9d58\"/><circle cx=\"32\" cy=\"32\" r=\"7\" fill=\"#fff\"/></svg>", "<svg viewBox=\"0 0 64 64\" width=\"1em\" height=\"1em\" style=\"display:block\"><circle cx=\"32\" cy=\"32\" r=\"24\" fill=\"none\" stroke=\"#0f9d58\" stroke-width=\"5\"/><path d=\"M21 33 L29 41 L44 24\" fill=\"none\" stroke=\"#0f9d58\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "<svg viewBox=\"0 0 64 64\" width=\"1em\" height=\"1em\" style=\"display:block\"><path d=\"M20 22 C8 22 8 42 20 42 C30 42 34 22 44 22 C56 22 56 42 44 42 C40 42 37 39 35 36\" fill=\"none\" stroke=\"#0f9d58\" stroke-width=\"6\" stroke-linecap=\"round\"/><path d=\"M29 37 L35 35 L37 42\" fill=\"none\" stroke=\"#0f9d58\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "<svg viewBox=\"0 0 64 64\" width=\"1em\" height=\"1em\" style=\"display:block\"><g fill=\"#0f9d58\"><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(0 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(45 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(90 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(135 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(180 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(225 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(270 32 32)\"/><rect x=\"28\" y=\"4\" width=\"8\" height=\"12\" rx=\"2\" transform=\"rotate(315 32 32)\"/></g><circle cx=\"32\" cy=\"32\" r=\"17\" fill=\"#0f9d58\"/><circle cx=\"32\" cy=\"32\" r=\"7\" fill=\"#fff\"/></svg>", "<svg viewBox=\"0 0 64 64\" width=\"1em\" height=\"1em\" style=\"display:block\"><circle cx=\"32\" cy=\"32\" r=\"24\" fill=\"none\" stroke=\"#0f9d58\" stroke-width=\"5\"/><path d=\"M21 33 L29 41 L44 24\" fill=\"none\" stroke=\"#0f9d58\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"].map((g, i) => { const hx = (Math.sin(i * 12.9) * 43758.5 % 1 + 1) % 1, hy = (Math.sin(i * 78.2) * 12543.1 % 1 + 1) % 1;
    return `<span style="left:${hx * 960 + Math.sin(t * .3 + i) * 30}px;top:${((hy * 1900 - t * (14 + i * 3)) % 1960 + 1960) % 1960 - 60}px;transform:rotate(${Math.sin(t * .2 + i * 2) * 14}deg);font-size:${46 + (i % 3) * 22}px">${g}</span>`; }).join("");
  // voice equalizer next to the handle
  { const env = window.VOICE ? (window.VOICE.env[Math.floor(t * window.VOICE.fps)] || 0) : speech(t, true).open;
    $("eq").innerHTML = [0, 1, 2, 3, 4, 5, 6].map(i => `<i style="height:${8 + env * (26 + 22 * Math.abs(Math.sin(t * 9 + i * 1.7)))}px"></i>`).join(""); }
  // confetti when he cheers
  { let cs = -1; S.forEach(s2 => s2.pose.forEach(([d, n]) => { if (n === "cheer" && s2.t + d <= t) cs = s2.t + d; })); const ct = t - cs;
    $("fx").innerHTML = cs >= 0 && ct < 2.4 ? `<svg width="1080" height="1920">${Array.from({ length: 46 }, (_, i) => { const a = -Math.PI / 2 + (((Math.sin(i * 7.3) * 9999) % 1) - .0) * 1.6, v = 700 + (i % 7) * 130;
      const x = 560 + Math.cos(a) * v * ct * (i % 2 ? 1 : -1) * .8, y = 1250 + Math.sin(a) * v * ct + 900 * ct * ct;
      return `<rect x="${x}" y="${y}" width="${14 + i % 3 * 6}" height="${10 + i % 2 * 12}" rx="3" fill="${["#0f9d58", "#151515", "#22a45d", "#2f6fe4", "#ffd84a"][i % 5]}" opacity="${clamp(2.4 - ct)}" transform="rotate(${i * 40 + ct * 400} ${x} ${y})"/>`; }).join("")}</svg>` : ""; }
  // presenter gives a small bounce on each scene change
  $("char").style.transform = `scale(${1 + punch * .012})`; $("char").style.transformOrigin = "50% 100%";
  $("prop").style.transform = `translate(${fitScale(sc) * 0 + sc.fitX + Math.sin(t * .5 + si) * 8 + lerp(-50, 0, easeOut(lt / .4))}px, ${Math.cos(t * .4) * 9}px) rotate(${lerp(si % 2 ? 1.5 : -1.5, Math.sin(t * .6 + si) * .8, enter)}deg) scale(${fitScale(sc) * lerp(1, 1.03, sk) * lerp(.9, 1, enter) * (1 + punch * .04)})`;
  $("prop").style.filter = `blur(${(1 - enter) * 4}px) drop-shadow(0 26px 30px rgba(60,50,20,.16))`;
  $("prop").style.opacity = clamp(lt / .3);
  $("kin").innerHTML = kinetic(t);
  // top meta row + commit-timeline progress: one dot per scene, HEAD rides along
  $("meta").innerHTML = `<span><span style="display:inline-flex;align-items:center;gap:14px"><span style="font-size:60px;margin:-18px 0"><svg viewBox="0 0 64 64" width="1em" height="1em" style="display:block"><path d="M20 22 C8 22 8 42 20 42 C30 42 34 22 44 22 C56 22 56 42 44 42 C40 42 37 39 35 36" fill="none" stroke="#0f9d58" stroke-width="6" stroke-linecap="round"/><path d="M29 37 L35 35 L37 42" fill="none" stroke="#0f9d58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>ep.13 · cicd intro</span></span><span>SCENE <b>${String(si + 1).padStart(2, "0")}</b>/${S.length}</span>`;
  { const W = 960, n = S.length, px = i => 14 + i * (W - 28) / (n - 1), hx = 14 + clamp(t / (END - 1.6)) * (W - 28);
    $("tl").innerHTML = `<svg width="${W}" height="30" viewBox="0 0 ${W} 30"><path d="M14 15 H${W - 14}" stroke="#d9d5c8" stroke-width="4" stroke-linecap="round"/><path d="M14 15 H${hx}" stroke="#151515" stroke-width="4" stroke-linecap="round"/>` +
      S.map((_, i) => `<circle cx="${px(i)}" cy="15" r="${i === si ? 10 : 7}" fill="${i <= si ? "#151515" : "#f3f1ea"}" stroke="${i <= si ? "#151515" : "#d9d5c8"}" stroke-width="4"/>`).join("") +
      `<circle cx="${hx}" cy="15" r="6" fill="#0f9d58"/></svg>`; }
  $("grid").style.backgroundPosition = `${t * 6}px ${t * 4}px`;
}

/* ---------- Playback ---------- */
function fit() { const s = Math.min(innerWidth / 1080, innerHeight / 1920); $("stage").style.transform = `scale(${s})`; }
addEventListener("resize", fit); fit();
window.DURATION = END;
window.render = render;
const q = new URLSearchParams(location.search);
if (q.has("render")) { $("hint").remove(); document.body.style.background = "transparent"; $("stage").style.transform = "none"; }
else if (q.has("t")) render(parseFloat(q.get("t")));
else {
  let t0 = performance.now();
  addEventListener("click", () => t0 = performance.now());
  (function loop(now) { render(((now - t0) / 1000) % END); requestAnimationFrame(loop); })(performance.now());
}
</script>
